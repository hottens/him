<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home Inventory</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    
    <!-- html5-qrcode library for barcode scanning -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-orange: #d29922;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
            --border-color: #30363d;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Header */
        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .settings-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            opacity: 0.6;
            transition: opacity 0.2s, color 0.2s;
            line-height: 1;
        }

        .settings-btn:hover {
            opacity: 1;
            color: var(--text-primary);
        }

        header h1::before {
            content: "📦";
        }

        /* Navigation Tabs */
        .tabs {
            display: flex;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .tab {
            flex: 1;
            padding: 0.75rem 0.5rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        .tab.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
        }

        .tab .count {
            background: var(--bg-tertiary);
            padding: 0.125rem 0.5rem;
            border-radius: 10px;
            font-size: 0.7rem;
            margin-left: 0.25rem;
        }

        .tab.active .count {
            background: var(--accent-blue);
            color: var(--bg-primary);
        }

        /* Sub-tabs */
        .sub-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            background: var(--bg-secondary);
            padding: 0.5rem;
            border-radius: 10px;
        }

        .sub-tab {
            flex: 1;
            padding: 0.5rem 0.75rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .sub-tab:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .sub-tab.active {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .sub-tab .count {
            background: var(--bg-primary);
            padding: 0.1rem 0.4rem;
            border-radius: 8px;
            font-size: 0.7rem;
            margin-left: 0.25rem;
        }

        .sub-panel {
            display: none;
        }

        .sub-panel.active {
            display: block;
        }

        /* Main Content */
        main {
            padding: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        /* Scanner Section */
        #scanner-container {
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-bottom: 1rem;
        }

        #reader {
            width: 100%;
        }

        #reader video {
            border-radius: 12px 12px 0 0;
        }

        .scanner-controls {
            padding: 1rem;
            display: flex;
            gap: 0.5rem;
        }

        .scanner-result {
            padding: 1rem;
            background: var(--bg-tertiary);
            border-top: 1px solid var(--border-color);
            font-family: var(--font-mono);
            font-size: 0.875rem;
        }

        .scanner-result.success {
            border-left: 3px solid var(--accent-green);
        }

        .scanner-result.new {
            border-left: 3px solid var(--accent-orange);
        }

        /* Buttons */
        .btn {
            padding: 0.625rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--bg-secondary);
            border-color: var(--text-secondary);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #fff;
        }

        .btn-primary:hover {
            background: #4c9aed;
            border-color: #4c9aed;
        }

        .btn-success {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: #fff;
        }

        .btn-success:hover {
            background: #36a348;
            border-color: #36a348;
        }

        .btn-warning {
            background: var(--accent-orange);
            border-color: var(--accent-orange);
            color: #fff;
        }

        .btn-warning:hover {
            background: #bf8a1f;
            border-color: #bf8a1f;
        }

        .btn-purple {
            background: var(--accent-purple);
            border-color: var(--accent-purple);
            color: #fff;
        }

        .btn-purple:hover {
            background: #8b5cf6;
            border-color: #8b5cf6;
        }

        .btn-block {
            width: 100%;
        }

        .btn-sm {
            padding: 0.5rem;
            font-size: 1rem;
        }

        /* Item List */
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .item-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            transition: border-color 0.2s;
        }

        .item-card:hover {
            border-color: var(--text-secondary);
        }

        .item-info {
            flex: 1;
            min-width: 0;
        }

        .item-name {
            font-weight: 500;
            margin-bottom: 0.25rem;
            word-break: break-word;
        }

        .item-product {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.125rem;
        }

        .item-barcodes {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }

        .item-actions {
            display: flex;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h2 {
            font-size: 1rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.25rem;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .modal-body {
            padding: 1rem;
        }

        /* Forms */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        .form-input, .form-select {
            width: 100%;
            padding: 0.625rem 0.875rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        /* Location Buttons in Modal */
        .location-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .location-buttons .btn {
            flex: 1;
        }

        /* Manual Add Section */
        .manual-add-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .manual-add-section h3 {
            font-size: 0.9rem;
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }

        .manual-add-row {
            display: flex;
            gap: 0.5rem;
        }

        .manual-add-row .form-input {
            flex: 1;
        }

        /* Search Results */
        .search-results {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-tertiary);
        }

        .search-result-item {
            padding: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.15s;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item:hover {
            background: var(--bg-secondary);
        }

        .search-result-item.selected {
            background: var(--accent-blue);
            color: #fff;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 1rem;
            left: 1rem;
            right: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 2000;
            pointer-events: none;
        }

        .toast {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.875rem 1rem;
            font-size: 0.875rem;
            animation: slideUp 0.3s ease-out;
            pointer-events: auto;
        }

        .toast.success {
            border-left: 3px solid var(--accent-green);
        }

        .toast.error {
            border-left: 3px solid var(--accent-red);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(1rem);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mode Indicator */
        .scan-mode {
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .scan-mode-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .scan-mode-value {
            font-weight: 600;
            font-size: 0.875rem;
        }

        .scan-mode-value.inventory {
            color: var(--accent-green);
        }

        .scan-mode-value.grocery {
            color: var(--accent-orange);
        }

        /* Mode Selection Buttons */
        .mode-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .mode-buttons .btn {
            flex: 1;
        }

        .mode-buttons .btn.active {
            box-shadow: 0 0 0 2px var(--bg-primary), 0 0 0 4px currentColor;
        }

        /* Recipe Card */
        .recipe-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .recipe-card:hover {
            border-color: var(--accent-purple);
        }

        .recipe-card h3 {
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }

        .recipe-card .recipe-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .recipe-card .favorite-star {
            color: var(--accent-orange);
        }

        .recipe-card .ingredient-status {
            margin-top: 0.5rem;
            padding: 0.5rem;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .recipe-card .ingredient-status.complete {
            background: rgba(63, 185, 80, 0.15);
            color: var(--accent-green);
        }

        .recipe-card .ingredient-status.partial {
            background: rgba(210, 153, 34, 0.15);
            color: var(--accent-orange);
        }

        .recipe-card .ingredient-status.missing {
            background: rgba(248, 81, 73, 0.15);
            color: var(--accent-red);
        }

        /* AI Suggestion Box */
        .ai-section {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary));
            border: 1px solid var(--accent-purple);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .ai-section h3 {
            color: var(--accent-purple);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .suggestion-card {
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.5rem;
        }

        .suggestion-card h4 {
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
        }

        .suggestion-card p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Loading spinner */
        .loading {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid var(--text-secondary);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Section Divider */
        .section-divider {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin: 1.5rem 0 1rem;
            position: relative;
        }

        .section-divider::before,
        .section-divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background: var(--border-color);
        }

        .section-divider::before { left: 0; }
        .section-divider::after { right: 0; }

        /* Settings */
        .settings-toggle {
            margin-bottom: 1rem;
        }

        .settings-toggle-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            font-size: 0.875rem;
            cursor: pointer;
        }

        .settings-toggle-label input[type="checkbox"] {
            width: 1.125rem;
            height: 1.125rem;
            accent-color: var(--accent-blue);
            flex-shrink: 0;
        }

        .settings-status {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        .settings-status.ok {
            color: var(--accent-green);
        }

        .settings-status.warn {
            color: var(--accent-orange);
        }

        /* Barcode list (edit modal) */
        .barcode-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .barcode-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding: 0.625rem 0.75rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .barcode-row:hover {
            border-color: var(--text-secondary);
        }

        .barcode-row.active {
            border-color: var(--accent-blue);
        }

        .barcode-code {
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }

        .barcode-product {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.125rem;
        }

        .barcode-badge {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--accent-blue);
            background: rgba(88, 166, 255, 0.15);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            margin-left: 0.5rem;
        }

        .barcode-row-actions {
            display: flex;
            gap: 0.25rem;
            flex-shrink: 0;
        }

        /* Responsive adjustments */
        @media (max-width: 400px) {
            .item-actions {
                flex-direction: column;
            }
            .tab {
                font-size: 0.75rem;
                padding: 0.75rem 0.25rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-row">
            <h1>Home Inventory</h1>
            <button class="settings-btn" onclick="openSettingsModal()" title="Settings" aria-label="Settings">⚙</button>
        </div>
    </header>

    <nav class="tabs">
        <button class="tab active" data-panel="scanner">📷 Scan</button>
        <button class="tab" data-panel="items">📦 Items<span class="count" id="items-count">0</span></button>
        <button class="tab" data-panel="recipes">🍳 Recipes<span class="count" id="recipes-count">0</span></button>
    </nav>

    <main>
        <!-- Scanner Panel -->
        <div id="scanner" class="panel active">
            <div class="mode-buttons">
                <button class="btn btn-success active" id="mode-inventory" onclick="setScanMode('inventory')">
                    🏠 Inventory
                </button>
                <button class="btn btn-warning" id="mode-grocery" onclick="setScanMode('grocery_list')">
                    🛒 Grocery
                </button>
            </div>

            <div class="scan-mode">
                <span class="scan-mode-label">Adding to:</span>
                <span class="scan-mode-value inventory" id="current-mode">Inventory</span>
            </div>

            <div id="scanner-container">
                <div id="reader"></div>
                <div class="scanner-controls">
                    <button class="btn btn-primary btn-block" id="start-scanner" onclick="toggleScanner()">
                        📷 Start Scanner
                    </button>
                </div>
                <div id="scanner-result" class="scanner-result" style="display: none;"></div>
            </div>

            <div class="section-divider">or add manually</div>

            <div class="manual-add-section">
                <div class="form-group">
                    <input type="text" class="form-input" id="manual-item-input" 
                           placeholder="Type item name..." list="items-datalist">
                    <datalist id="items-datalist"></datalist>
                </div>
                <div class="location-buttons">
                    <button class="btn btn-success" onclick="manualAddItem('inventory')">🏠 Inventory</button>
                    <button class="btn btn-warning" onclick="manualAddItem('grocery_list')">🛒 Grocery</button>
                </div>
            </div>
        </div>

        <!-- Items Panel (Inventory + Grocery) -->
        <div id="items" class="panel">
            <!-- Sub-tabs for Inventory/Grocery -->
            <div class="sub-tabs">
                <button class="sub-tab active" data-subtab="grocery-section">🛒 Grocery<span class="count" id="grocery-count">0</span></button>
                <button class="sub-tab" data-subtab="inventory-section">🏠 Inventory<span class="count" id="inventory-count">0</span></button>
            </div>

            <!-- Grocery Section -->
            <div id="grocery-section" class="sub-panel active">
                <div class="manual-add-section">
                    <div class="manual-add-row">
                        <input type="text" class="form-input" id="grocery-add-input" 
                               placeholder="Add to grocery list..." list="items-datalist">
                        <button class="btn btn-warning" onclick="quickAddToGrocery()">Add</button>
                    </div>
                </div>
                
                <div class="ai-section" id="grocery-ai-section">
                    <h3>✨ Smart Suggestions</h3>
                    <button class="btn btn-purple btn-block" onclick="getGrocerySuggestions()" id="grocery-suggest-btn">
                        Suggest Items
                    </button>
                    <div id="grocery-suggestions"></div>
                </div>
                
                <div id="grocery-list" class="item-list"></div>
            </div>

            <!-- Inventory Section -->
            <div id="inventory-section" class="sub-panel">
                <div class="manual-add-section">
                    <div class="manual-add-row">
                        <input type="text" class="form-input" id="inventory-add-input" 
                               placeholder="Add to inventory..." list="items-datalist">
                        <button class="btn btn-success" onclick="quickAddToInventory()">Add</button>
                    </div>
                </div>
                
                <div id="inventory-list" class="item-list"></div>
            </div>
        </div>

        <!-- Recipes Panel (Saved + Favorites + Discover) -->
        <div id="recipes" class="panel">
            <!-- Sub-tabs for recipes -->
            <div class="sub-tabs">
                <button class="sub-tab active" data-subtab="favorites-section">⭐ Favorites<span class="count" id="favorites-count">0</span></button>
                <button class="sub-tab" data-subtab="all-recipes-section">📖 All</button>
                <button class="sub-tab" data-subtab="discover-section">🔍 Discover</button>
            </div>

            <!-- Favorites Section -->
            <div id="favorites-section" class="sub-panel active">
                <div id="favorites-list"></div>
            </div>

            <!-- All Recipes Section -->
            <div id="all-recipes-section" class="sub-panel">
                <div id="recipe-list"></div>
            </div>

            <!-- Discover Section -->
            <div id="discover-section" class="sub-panel">
                <!-- Gemini AI Suggestions -->
                <div class="ai-section" style="border-color: var(--accent-purple); margin-bottom: 1rem;">
                    <h3 style="color: var(--accent-purple);">✨ AI Recipe Ideas</h3>
                    <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.75rem;">
                        Get creative recipe suggestions from Gemini AI
                    </p>
                    <div class="form-group" style="margin-bottom: 0.75rem;">
                        <input type="text" class="form-input" id="gemini-query-input" 
                               placeholder="Optional: soup, Italian, quick meals...">
                    </div>
                    <button class="btn btn-purple btn-block" onclick="getGeminiRecipes()" id="gemini-recipe-btn">
                        ✨ Generate Recipe Ideas
                    </button>
                </div>
                <div id="gemini-results"></div>
            </div>
        </div>
    </main>

    <!-- New Item Modal -->
    <div class="modal-overlay" id="new-item-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>New Barcode Scanned</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Barcode</label>
                    <input type="text" class="form-input" id="modal-barcode" readonly>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Item Name</label>
                    <input type="text" class="form-input" id="modal-item-name" 
                           placeholder="Enter item name or search existing...">
                    <div class="search-results" id="search-results" style="display: none;"></div>
                </div>

                <div class="location-buttons">
                    <button class="btn btn-success" onclick="createItem('inventory')">🏠 Inventory</button>
                    <button class="btn btn-warning" onclick="createItem('grocery_list')">🛒 Grocery</button>
                    <button class="btn" onclick="createItem('neither')">📦 Archive</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Item Modal -->
    <div class="modal-overlay" id="edit-item-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>Edit Item</h2>
                <button class="modal-close" onclick="closeEditItemModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Item Name</label>
                    <input type="text" class="form-input" id="edit-item-name">
                </div>
                <div class="form-group">
                    <label class="form-label">Location</label>
                    <select class="form-select" id="edit-item-location">
                        <option value="inventory">🏠 Inventory</option>
                        <option value="grocery_list">🛒 Grocery List</option>
                        <option value="neither">📦 Archive</option>
                    </select>
                </div>
                <div class="form-group" id="edit-barcodes-group" style="display: none;">
                    <label class="form-label">Barcodes</label>
                    <div id="edit-barcodes-list" class="barcode-list"></div>
                </div>
                <div class="location-buttons">
                    <button class="btn btn-danger" onclick="deleteEditingItem()" style="background: var(--accent-red); border-color: var(--accent-red);">Delete</button>
                    <button class="btn" onclick="closeEditItemModal()">Cancel</button>
                    <button class="btn btn-primary" onclick="saveEditingItem()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Grocery Suggestion Match Modal -->
    <div class="modal-overlay" id="grocery-match-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>Add to Grocery List</h2>
                <button class="modal-close" onclick="closeGroceryMatchModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 0.75rem;">Adding: <strong id="grocery-match-name"></strong></p>
                <div id="grocery-match-results"></div>
                <div class="form-group" style="margin-top: 1rem;">
                    <label class="form-label">Or create as new item</label>
                    <input type="text" class="form-input" id="grocery-match-new-name" placeholder="Item name">
                </div>
                <div class="location-buttons">
                    <button class="btn" onclick="closeGroceryMatchModal()">Cancel</button>
                    <button class="btn btn-warning" onclick="confirmGroceryMatch()">Add to Grocery</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="modal-close" onclick="closeSettingsModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="settings-toggle">
                    <label class="settings-toggle-label">
                        <span>Auto-fetch product data from Open Food Facts</span>
                        <input type="checkbox" id="setting-auto-fetch" onchange="updateSetting('auto_fetch_products', this.checked)">
                    </label>
                </div>
                <div class="settings-toggle">
                    <label class="settings-toggle-label">
                        <span>Translate ingredients to Dutch via Gemini</span>
                        <input type="checkbox" id="setting-translate" onchange="updateSetting('translate_ingredients', this.checked)">
                    </label>
                </div>
                <p class="settings-status" id="settings-gemini-status"></p>
                <button class="btn btn-block" id="reload-barcodes-btn" onclick="reloadAllBarcodes()" style="margin-top: 1rem;">
                    Reload all barcodes from Open Food Facts
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        // State
        let html5QrCode = null;
        let isScanning = false;
        let currentScanMode = 'inventory'; // 'inventory' or 'grocery_list'
        let pendingBarcode = null;
        let selectedExistingItem = null;
        let allItems = [];
        // API base URL
        const API_BASE = '/api';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Set up tab navigation
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => switchPanel(tab.dataset.panel));
            });

            // Set up sub-tab navigation
            document.querySelectorAll('.sub-tab').forEach(tab => {
                tab.addEventListener('click', () => switchSubPanel(tab));
            });

            // Set up item name search in modal
            const itemNameInput = document.getElementById('modal-item-name');
            let searchTimeout;
            itemNameInput.addEventListener('input', () => {
                clearTimeout(searchTimeout);
                selectedExistingItem = null;
                searchTimeout = setTimeout(() => searchItems(itemNameInput.value), 300);
            });

            // Handle Enter key for manual inputs
            document.getElementById('manual-item-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') manualAddItem(currentScanMode);
            });
            document.getElementById('inventory-add-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') quickAddToInventory();
            });
            document.getElementById('grocery-add-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') quickAddToGrocery();
            });

            // Load initial data
            loadInventory();
            loadGrocery();
            loadAllItems();
            loadRecipes();
            loadFavorites();

            // Enter key support for Gemini query input
            document.getElementById('gemini-query-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') getGeminiRecipes();
            });
        });

        // Panel Navigation
        function switchPanel(panelId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            
            document.querySelector(`[data-panel="${panelId}"]`).classList.add('active');
            document.getElementById(panelId).classList.add('active');

            // Stop scanner when leaving scanner panel
            if (panelId !== 'scanner' && isScanning) {
                stopScanner();
            }
        }

        // Sub-panel Navigation
        function switchSubPanel(tabElement) {
            const container = tabElement.closest('.panel');
            const subtabId = tabElement.dataset.subtab;
            
            // Update sub-tab styles
            container.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
            tabElement.classList.add('active');
            
            // Show/hide sub-panels
            container.querySelectorAll('.sub-panel').forEach(p => p.classList.remove('active'));
            document.getElementById(subtabId).classList.add('active');
        }

        // Update combined counts
        function updateItemsCount() {
            const inventory = parseInt(document.getElementById('inventory-count').textContent) || 0;
            const grocery = parseInt(document.getElementById('grocery-count').textContent) || 0;
            document.getElementById('items-count').textContent = inventory + grocery;
        }

        function updateRecipesCount() {
            const favorites = parseInt(document.getElementById('favorites-count').textContent) || 0;
            document.getElementById('recipes-count').textContent = favorites;
        }

        // Scan Mode
        function setScanMode(mode) {
            currentScanMode = mode;
            const modeIndicator = document.getElementById('current-mode');
            const inventoryBtn = document.getElementById('mode-inventory');
            const groceryBtn = document.getElementById('mode-grocery');

            if (mode === 'inventory') {
                modeIndicator.textContent = 'Inventory';
                modeIndicator.className = 'scan-mode-value inventory';
                inventoryBtn.classList.add('active');
                groceryBtn.classList.remove('active');
            } else {
                modeIndicator.textContent = 'Grocery List';
                modeIndicator.className = 'scan-mode-value grocery';
                groceryBtn.classList.add('active');
                inventoryBtn.classList.remove('active');
            }
        }

        // Scanner Functions
        async function toggleScanner() {
            if (isScanning) {
                await stopScanner();
            } else {
                await startScanner();
            }
        }

        async function startScanner() {
            const btn = document.getElementById('start-scanner');
            
            try {
                html5QrCode = new Html5Qrcode("reader");
                
                await html5QrCode.start(
                    { facingMode: "environment" },
                    {
                        fps: 10,
                        qrbox: { width: 250, height: 100 },
                        aspectRatio: 1.0
                    },
                    onScanSuccess,
                    onScanFailure
                );
                
                isScanning = true;
                btn.textContent = '⏹ Stop Scanner';
                btn.classList.remove('btn-primary');
            } catch (err) {
                console.error('Failed to start scanner:', err);
                showToast('Camera access failed. Try HTTPS or check permissions.', 'error');
            }
        }

        async function stopScanner() {
            const btn = document.getElementById('start-scanner');
            
            if (html5QrCode && isScanning) {
                try {
                    await html5QrCode.stop();
                } catch (err) {
                    console.error('Error stopping scanner:', err);
                }
            }
            
            isScanning = false;
            btn.textContent = '📷 Start Scanner';
            btn.classList.add('btn-primary');
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (navigator.vibrate) navigator.vibrate(100);
            lookupBarcode(decodedText);
        }

        function onScanFailure(error) {}

        // Barcode Lookup
        async function lookupBarcode(code) {
            const resultDiv = document.getElementById('scanner-result');
            resultDiv.style.display = 'block';
            resultDiv.textContent = `Looking up: ${code}...`;
            resultDiv.className = 'scanner-result';

            try {
                const response = await fetch(`${API_BASE}/barcode/${encodeURIComponent(code)}`);
                const data = await response.json();

                if (data.found) {
                    resultDiv.innerHTML = `✓ Found: <strong>${data.item.name}</strong>`;
                    resultDiv.className = 'scanner-result success';
                    
                    await moveItem(data.item.id, currentScanMode);
                    showToast(`${data.item.name} → ${currentScanMode === 'inventory' ? 'Inventory' : 'Grocery List'}`, 'success');
                    
                    loadInventory();
                    loadGrocery();
                } else {
                    resultDiv.innerHTML = `⚠ New barcode: <strong>${code}</strong>`;
                    resultDiv.className = 'scanner-result new';
                    showNewItemModal(code, data.suggested_name, data.suggested_brands);
                }
            } catch (err) {
                resultDiv.textContent = `Error: ${err.message}`;
                showToast('Failed to look up barcode', 'error');
            }
        }

        // Modal Functions
        function showNewItemModal(barcode, suggestedName, suggestedBrands) {
            pendingBarcode = barcode;
            selectedExistingItem = null;
            
            document.getElementById('modal-barcode').value = barcode;
            const nameInput = document.getElementById('modal-item-name');
            // Prefer product name; fall back to brands so the field isn't empty
            nameInput.value = (suggestedName || suggestedBrands || '').trim();
            document.getElementById('search-results').style.display = 'none';
            document.getElementById('new-item-modal').classList.add('active');
            if (nameInput.value) {
                nameInput.select();
            } else {
                nameInput.focus();
            }
        }

        function closeModal() {
            document.getElementById('new-item-modal').classList.remove('active');
            pendingBarcode = null;
            selectedExistingItem = null;
        }

        async function searchItems(query) {
            const resultsDiv = document.getElementById('search-results');
            
            if (!query || query.length < 2) {
                resultsDiv.style.display = 'none';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/search?q=${encodeURIComponent(query)}`);
                const items = await response.json();

                if (items.length === 0) {
                    resultsDiv.style.display = 'none';
                    return;
                }

                resultsDiv.innerHTML = items.map(item => `
                    <div class="search-result-item" onclick="selectExistingItem(${item.id}, '${item.name.replace(/'/g, "\\'")}')">
                        ${item.name}
                        <small style="color: var(--text-secondary); display: block;">
                            ${item.location === 'inventory' ? '🏠 Inventory' : 
                              item.location === 'grocery_list' ? '🛒 Grocery' : 
                              '📦 Archive'}
                        </small>
                    </div>
                `).join('');
                resultsDiv.style.display = 'block';
            } catch (err) {
                console.error('Error searching items:', err);
            }
        }

        function selectExistingItem(id, name) {
            selectedExistingItem = { id, name };
            document.getElementById('modal-item-name').value = name;
            document.getElementById('search-results').style.display = 'none';
        }

        async function createItem(location) {
            const itemName = document.getElementById('modal-item-name').value.trim();
            
            if (!itemName) {
                showToast('Please enter an item name', 'error');
                return;
            }

            try {
                if (selectedExistingItem) {
                    await fetch(`${API_BASE}/barcode/associate`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            barcode: pendingBarcode,
                            item_id: selectedExistingItem.id
                        })
                    });
                    
                    await moveItem(selectedExistingItem.id, location);
                    showToast(`Added barcode to ${selectedExistingItem.name}`, 'success');
                } else {
                    const response = await fetch(`${API_BASE}/items`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: itemName,
                            location: location,
                            barcode: pendingBarcode
                        })
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.detail || 'Failed to create item');
                    }

                    showToast(`Created: ${itemName}`, 'success');
                }

                closeModal();
                loadInventory();
                loadGrocery();
                loadAllItems();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        // Manual Add Functions
        async function manualAddItem(location) {
            const input = document.getElementById('manual-item-input');
            const itemName = input.value.trim();
            
            if (!itemName) return;

            try {
                // Check if item exists
                const existing = allItems.find(i => i.name.toLowerCase() === itemName.toLowerCase());
                
                if (existing) {
                    await moveItem(existing.id, location);
                    showToast(`${existing.name} → ${getLocationLabel(location)}`, 'success');
                } else {
                    const response = await fetch(`${API_BASE}/items`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: itemName, location: location })
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.detail);
                    }

                    showToast(`Created: ${itemName}`, 'success');
                }

                input.value = '';
                loadInventory();
                loadGrocery();
                loadAllItems();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function quickAddToInventory() {
            const input = document.getElementById('inventory-add-input');
            const itemName = input.value.trim();
            if (!itemName) return;

            const existing = allItems.find(i => i.name.toLowerCase() === itemName.toLowerCase());
            
            try {
                if (existing) {
                    await moveItem(existing.id, 'inventory');
                } else {
                    await fetch(`${API_BASE}/items`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: itemName, location: 'inventory' })
                    });
                }
                
                input.value = '';
                showToast(`${itemName} added to inventory`, 'success');
                loadInventory();
                loadGrocery();
                loadAllItems();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function quickAddToGrocery() {
            const input = document.getElementById('grocery-add-input');
            const itemName = input.value.trim();
            if (!itemName) return;

            const existing = allItems.find(i => i.name.toLowerCase() === itemName.toLowerCase());
            
            try {
                if (existing) {
                    await moveItem(existing.id, 'grocery_list');
                } else {
                    await fetch(`${API_BASE}/items`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: itemName, location: 'grocery_list' })
                    });
                }
                
                input.value = '';
                showToast(`${itemName} added to grocery list`, 'success');
                loadInventory();
                loadGrocery();
                loadAllItems();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        function getLocationLabel(location) {
            const labels = {
                'inventory': '🏠 Inventory',
                'grocery_list': '🛒 Grocery',
                'neither': '📦 Archive'
            };
            return labels[location] || location;
        }

        // Item Management
        async function moveItem(itemId, location) {
            const endpoint = location === 'inventory' ? 'to-inventory' : 
                            location === 'grocery_list' ? 'to-grocery' : 'remove';
            
            await fetch(`${API_BASE}/items/${itemId}/${endpoint}`, { method: 'POST' });
            loadInventory();
            loadGrocery();
        }

        async function removeItem(itemId) {
            await fetch(`${API_BASE}/items/${itemId}/remove`, { method: 'POST' });
            showToast('Item archived', 'success');
            loadInventory();
            loadGrocery();
        }

        // Load Lists
        async function loadAllItems() {
            try {
                const response = await fetch(`${API_BASE}/items`);
                allItems = await response.json();
                
                // Update datalist
                const datalist = document.getElementById('items-datalist');
                datalist.innerHTML = allItems.map(item => 
                    `<option value="${item.name}">`
                ).join('');
            } catch (err) {
                console.error('Error loading items:', err);
            }
        }

        async function loadInventory() {
            try {
                const response = await fetch(`${API_BASE}/inventory`);
                const data = await response.json();
                
                document.getElementById('inventory-count').textContent = data.count;
                updateItemsCount();
                
                const listDiv = document.getElementById('inventory-list');
                if (data.items.length === 0) {
                    listDiv.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">🏠</div>
                            <p>No items in inventory</p>
                        </div>
                    `;
                } else {
                    listDiv.innerHTML = data.items.map(item => renderItemCard(item, 'inventory')).join('');
                }
            } catch (err) {
                console.error('Error loading inventory:', err);
            }
        }

        async function loadGrocery() {
            try {
                const response = await fetch(`${API_BASE}/grocery`);
                const data = await response.json();
                
                document.getElementById('grocery-count').textContent = data.count;
                updateItemsCount();
                
                const listDiv = document.getElementById('grocery-list');
                if (data.items.length === 0) {
                    listDiv.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">🛒</div>
                            <p>Grocery list is empty</p>
                        </div>
                    `;
                } else {
                    listDiv.innerHTML = data.items.map(item => renderItemCard(item, 'grocery')).join('');
                }
            } catch (err) {
                console.error('Error loading grocery list:', err);
            }
        }

        function renderItemCard(item, currentList) {
            const activeBarcode = item.barcodes.find(b => b.is_active);
            const productLabel = activeBarcode && (activeBarcode.product_name || activeBarcode.brands)
                ? (activeBarcode.product_name || activeBarcode.brands)
                : null;
            const barcodesLine = item.barcodes.length
                ? item.barcodes.map(b => `${b.is_active ? '★ ' : ''}${b.code}`).join(', ')
                : '';

            return `
                <div class="item-card">
                    <div class="item-info" onclick="openEditItemModal(${item.id}, '${item.name.replace(/'/g, "\\'")}', '${item.location}')" style="cursor: pointer;">
                        <div class="item-name">${item.name}</div>
                        ${productLabel ? `<div class="item-product">${escapeHtml(productLabel)}</div>` : ''}
                        ${barcodesLine ? `<div class="item-barcodes">${barcodesLine}</div>` : ''}
                    </div>
                    <div class="item-actions">
                        ${currentList === 'inventory' ? `
                            <button class="btn btn-warning btn-sm" onclick="moveItem(${item.id}, 'grocery_list')" title="To Grocery">🛒</button>
                        ` : `
                            <button class="btn btn-success btn-sm" onclick="moveItem(${item.id}, 'inventory')" title="To Inventory">🏠</button>
                        `}
                        <button class="btn btn-sm" onclick="removeItem(${item.id})" title="Archive">📦</button>
                        <button class="btn btn-sm" onclick="openEditItemModal(${item.id}, '${item.name.replace(/'/g, "\\'")}', '${item.location}')" title="Edit">✏️</button>
                    </div>
                </div>
            `;
        }

        // Recipe Functions
        async function loadRecipes() {
            try {
                const response = await fetch(`${API_BASE}/recipes`);
                const data = await response.json();
                
                updateRecipesCount();
                
                const listDiv = document.getElementById('recipe-list');
                if (data.recipes.length === 0) {
                    listDiv.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📖</div>
                            <p>No saved recipes yet</p>
                            <p style="font-size: 0.85rem; margin-top: 0.5rem;">
                                Use Discover to find and import recipes!
                            </p>
                        </div>
                    `;
                } else {
                    listDiv.innerHTML = data.recipes.map(recipe => `
                        <div class="recipe-card" style="display: flex; justify-content: space-between; align-items: center;">
                            <div onclick="window.location.href='/recipe/${recipe.id}'" style="flex: 1; cursor: pointer;">
                                <h3>
                                    ${recipe.is_favorite ? '<span class="favorite-star">★</span> ' : ''}
                                    ${recipe.name}
                                </h3>
                                <div class="recipe-meta">
                                    ${recipe.servings} servings
                                    ${recipe.prep_time_minutes ? ` • ${recipe.prep_time_minutes}min prep` : ''}
                                    ${recipe.cook_time_minutes ? ` • ${recipe.cook_time_minutes}min cook` : ''}
                                </div>
                            </div>
                            <div style="display: flex; gap: 0.5rem; flex-shrink: 0;" onclick="event.stopPropagation();">
                                <button class="btn btn-sm" onclick="window.location.href='/recipe/${recipe.id}?edit=1'" title="Edit">
                                    ✏️
                                </button>
                                <button class="btn btn-sm" onclick="toggleFavoriteRecipe(${recipe.id})" title="${recipe.is_favorite ? 'Unfavorite' : 'Favorite'}">
                                    ${recipe.is_favorite ? '★' : '☆'}
                                </button>
                                <button class="btn btn-sm" onclick="deleteRecipe(${recipe.id}, '${recipe.name.replace(/'/g, "\\'")}')" title="Delete" style="color: var(--accent-red);">
                                    🗑
                                </button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error('Error loading recipes:', err);
            }
        }

        async function loadFavorites() {
            try {
                const [recipesRes, inventoryRes] = await Promise.all([
                    fetch(`${API_BASE}/recipes?favorites_only=true`),
                    fetch(`${API_BASE}/inventory`)
                ]);
                
                const recipesData = await recipesRes.json();
                const inventoryData = await inventoryRes.json();
                
                // Create a set of inventory item names (lowercase for matching)
                const inventoryNames = new Set(
                    inventoryData.items.map(item => item.name.toLowerCase())
                );
                
                document.getElementById('favorites-count').textContent = recipesData.count;
                updateRecipesCount();
                
                const listDiv = document.getElementById('favorites-list');
                if (recipesData.recipes.length === 0) {
                    listDiv.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">⭐</div>
                            <p>No favorite recipes yet</p>
                            <p style="font-size: 0.85rem; margin-top: 0.5rem;">
                                Mark recipes as favorites to see them here
                            </p>
                        </div>
                    `;
                } else {
                    listDiv.innerHTML = recipesData.recipes.map(recipe => {
                        // Check ingredient availability
                        const ingredients = recipe.ingredients || [];
                        const totalIngredients = ingredients.length;
                        const availableIngredients = ingredients.filter(ing => 
                            inventoryNames.has(ing.name.toLowerCase())
                        ).length;
                        
                        let statusClass, statusText;
                        if (totalIngredients === 0) {
                            statusClass = 'partial';
                            statusText = 'No ingredients listed';
                        } else if (availableIngredients === totalIngredients) {
                            statusClass = 'complete';
                            statusText = `✓ All ${totalIngredients} ingredients in stock`;
                        } else if (availableIngredients === 0) {
                            statusClass = 'missing';
                            statusText = `✗ 0/${totalIngredients} ingredients in stock`;
                        } else {
                            statusClass = 'partial';
                            statusText = `◐ ${availableIngredients}/${totalIngredients} ingredients in stock`;
                        }
                        
                        return `
                            <div class="recipe-card" style="display: flex; justify-content: space-between; align-items: flex-start;">
                                <div onclick="window.location.href='/recipe/${recipe.id}'" style="flex: 1; cursor: pointer;">
                                    <h3>
                                        <span class="favorite-star">★</span>
                                        ${recipe.name}
                                    </h3>
                                    <div class="recipe-meta">
                                        ${recipe.servings} servings
                                        ${recipe.prep_time_minutes ? ` • ${recipe.prep_time_minutes}min prep` : ''}
                                        ${recipe.cook_time_minutes ? ` • ${recipe.cook_time_minutes}min cook` : ''}
                                    </div>
                                    <div class="ingredient-status ${statusClass}">
                                        ${statusText}
                                    </div>
                                </div>
                                <div style="display: flex; gap: 0.5rem; flex-shrink: 0;" onclick="event.stopPropagation();">
                                    <button class="btn btn-sm" onclick="window.location.href='/recipe/${recipe.id}?edit=1'" title="Edit">✏️</button>
                                    <button class="btn btn-sm" onclick="toggleFavoriteRecipe(${recipe.id})" title="Unfavorite">★</button>
                                    <button class="btn btn-sm" onclick="deleteRecipe(${recipe.id}, '${recipe.name.replace(/'/g, "\\'")}')" title="Delete" style="color: var(--accent-red);">🗑</button>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            } catch (err) {
                console.error('Error loading favorites:', err);
            }
        }

        async function getGrocerySuggestions() {
            const btn = document.getElementById('grocery-suggest-btn');
            const container = document.getElementById('grocery-suggestions');
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Analyzing...';
            container.innerHTML = '';

            try {
                const response = await fetch(`${API_BASE}/ai/grocery-suggestions`, { method: 'POST' });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail);
                }

                const data = await response.json();
                
                if (data.suggestions.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-secondary); margin-top: 1rem;">No suggestions at this time.</p>';
                } else {
                    container.innerHTML = `
                        <div style="margin-top: 1rem;">
                            ${data.suggestions.map(s => `
                                <div class="suggestion-card" style="display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <strong>${s.item_name}</strong>
                                        <p>${s.reason}</p>
                                    </div>
                                    <button class="btn btn-warning btn-sm" onclick="addSuggestionToGroceryWithMatch('${s.item_name.replace(/'/g, "\\'")}')">
                                        + Add
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }
            } catch (err) {
                container.innerHTML = `<p style="color: var(--accent-red); margin-top: 1rem;">${err.message}</p>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Get Smart Suggestions';
            }
        }

        async function addSuggestionToGrocery(itemName) {
            const existing = allItems.find(i => i.name.toLowerCase() === itemName.toLowerCase());
            
            try {
                if (existing) {
                    await moveItem(existing.id, 'grocery_list');
                } else {
                    await fetch(`${API_BASE}/items`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: itemName, location: 'grocery_list' })
                    });
                }
                
                showToast(`${itemName} added to grocery list`, 'success');
                loadGrocery();
                loadAllItems();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        // Toast Notifications
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => toast.remove(), 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ========== Settings Modal ==========
        async function openSettingsModal() {
            document.getElementById('settings-modal').classList.add('active');
            try {
                const response = await fetch(`${API_BASE}/settings`);
                if (!response.ok) throw new Error('Failed to load settings');
                const settings = await response.json();
                document.getElementById('setting-auto-fetch').checked = settings.auto_fetch_products;
                document.getElementById('setting-translate').checked = settings.translate_ingredients;
                const statusEl = document.getElementById('settings-gemini-status');
                statusEl.textContent = settings.gemini_configured
                    ? '✓ Gemini API configured'
                    : '✗ Gemini API not configured';
                statusEl.className = 'settings-status ' + (settings.gemini_configured ? 'ok' : 'warn');
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        function closeSettingsModal() {
            document.getElementById('settings-modal').classList.remove('active');
        }

        async function updateSetting(key, value) {
            try {
                const response = await fetch(`${API_BASE}/settings`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ [key]: value })
                });
                if (!response.ok) throw new Error('Failed to save setting');
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function reloadAllBarcodes() {
            const btn = document.getElementById('reload-barcodes-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Reloading...';
            try {
                const response = await fetch(`${API_BASE}/barcodes/reload-all`, { method: 'POST' });
                if (!response.ok) throw new Error('Reload failed');
                const result = await response.json();
                showToast(`${result.updated} updated, ${result.not_found} not found, ${result.errors} errors`, 'success');
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Reload all barcodes from Open Food Facts';
            }
        }

        // ========== Edit Item Modal ==========
        let editingItemId = null;

        async function openEditItemModal(id, name, location) {
            editingItemId = id;
            document.getElementById('edit-item-name').value = name;
            document.getElementById('edit-item-location').value = location;
            document.getElementById('edit-item-modal').classList.add('active');

            const barcodesGroup = document.getElementById('edit-barcodes-group');
            const barcodesList = document.getElementById('edit-barcodes-list');
            barcodesList.innerHTML = '<span class="loading"></span> Loading barcodes...';
            barcodesGroup.style.display = 'block';

            try {
                const response = await fetch(`${API_BASE}/items/${id}`);
                if (!response.ok) throw new Error('Failed to load item');
                renderEditBarcodes(await response.json());
            } catch (err) {
                barcodesList.innerHTML = `<p style="color: var(--accent-red); font-size: 0.85rem;">${escapeHtml(err.message)}</p>`;
            }
        }

        function renderEditBarcodes(item) {
            const barcodesGroup = document.getElementById('edit-barcodes-group');
            const barcodesList = document.getElementById('edit-barcodes-list');

            if (!item.barcodes || item.barcodes.length === 0) {
                barcodesGroup.style.display = 'none';
                return;
            }

            barcodesGroup.style.display = 'block';
            barcodesList.innerHTML = item.barcodes.map(b => {
                const label = b.product_name || b.brands || '';
                return `
                    <div class="barcode-row ${b.is_active ? 'active' : ''}" onclick="setActiveBarcode(${b.id})">
                        <div class="barcode-row-main">
                            <span>
                                <code class="barcode-code">${escapeHtml(b.code)}</code>
                                ${b.is_active ? '<span class="barcode-badge">Active</span>' : ''}
                            </span>
                            ${label ? `<div class="barcode-product">${escapeHtml(label)}</div>` : ''}
                        </div>
                        <div class="barcode-row-actions" onclick="event.stopPropagation()">
                            ${!b.is_active ? `<button class="btn btn-sm" onclick="setActiveBarcode(${b.id})">Set active</button>` : ''}
                            <button class="btn btn-sm" onclick="refreshBarcode(${b.id})" title="Refresh from Open Food Facts">↻</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function setActiveBarcode(barcodeId) {
            if (!editingItemId) return;
            try {
                const response = await fetch(`${API_BASE}/items/${editingItemId}/active-barcode`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ barcode_id: barcodeId })
                });
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to set active barcode');
                }
                renderEditBarcodes(await response.json());
                loadInventory();
                loadGrocery();
                showToast('Active barcode updated', 'success');
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function refreshBarcode(barcodeId) {
            try {
                const response = await fetch(`${API_BASE}/barcodes/${barcodeId}/fetch`, { method: 'POST' });
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to refresh barcode');
                }
                if (editingItemId) {
                    const itemRes = await fetch(`${API_BASE}/items/${editingItemId}`);
                    if (itemRes.ok) renderEditBarcodes(await itemRes.json());
                }
                loadInventory();
                loadGrocery();
                showToast('Barcode refreshed', 'success');
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        function closeEditItemModal() {
            document.getElementById('edit-item-modal').classList.remove('active');
            document.getElementById('edit-barcodes-group').style.display = 'none';
            document.getElementById('edit-barcodes-list').innerHTML = '';
            editingItemId = null;
        }

        async function saveEditingItem() {
            if (!editingItemId) return;

            const name = document.getElementById('edit-item-name').value.trim();
            const location = document.getElementById('edit-item-location').value;

            if (!name) {
                showToast('Item name cannot be empty', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/items/${editingItemId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, location })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail);
                }

                showToast('Item updated', 'success');
                closeEditItemModal();
                loadInventory();
                loadGrocery();
                loadAllItems();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function deleteEditingItem() {
            if (!editingItemId) return;

            if (!confirm('Are you sure you want to delete this item? This cannot be undone.')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/items/${editingItemId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete item');
                }

                showToast('Item deleted', 'success');
                closeEditItemModal();
                loadInventory();
                loadGrocery();
                loadAllItems();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        // ========== Grocery Suggestion Matching ==========
        let pendingGroceryItem = null;
        let selectedMatchItem = null;

        async function addSuggestionToGroceryWithMatch(itemName) {
            pendingGroceryItem = itemName;
            selectedMatchItem = null;
            
            document.getElementById('grocery-match-name').textContent = itemName;
            document.getElementById('grocery-match-new-name').value = itemName;
            
            // Search for similar items
            const resultsDiv = document.getElementById('grocery-match-results');
            const matches = allItems.filter(i => 
                i.name.toLowerCase().includes(itemName.toLowerCase()) ||
                itemName.toLowerCase().includes(i.name.toLowerCase())
            );
            
            if (matches.length > 0) {
                resultsDiv.innerHTML = `
                    <label class="form-label">Match with existing item:</label>
                    <div class="search-results" style="display: block; max-height: 150px;">
                        ${matches.slice(0, 5).map(item => `
                            <div class="search-result-item ${selectedMatchItem?.id === item.id ? 'selected' : ''}" 
                                 onclick="selectGroceryMatch(${item.id}, '${item.name.replace(/'/g, "\\'")}')">
                                ${item.name}
                                <small style="color: var(--text-secondary);">
                                    ${item.location === 'inventory' ? '🏠' : item.location === 'grocery_list' ? '🛒' : '📦'}
                                </small>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                resultsDiv.innerHTML = '<p style="color: var(--text-secondary); font-size: 0.85rem;">No similar items found in database.</p>';
            }
            
            document.getElementById('grocery-match-modal').classList.add('active');
        }

        function selectGroceryMatch(id, name) {
            selectedMatchItem = { id, name };
            document.getElementById('grocery-match-new-name').value = '';
            
            // Update UI to show selection
            document.querySelectorAll('#grocery-match-results .search-result-item').forEach(el => {
                el.classList.remove('selected');
            });
            event.target.closest('.search-result-item').classList.add('selected');
        }

        function closeGroceryMatchModal() {
            document.getElementById('grocery-match-modal').classList.remove('active');
            pendingGroceryItem = null;
            selectedMatchItem = null;
        }

        async function confirmGroceryMatch() {
            try {
                if (selectedMatchItem) {
                    // Use existing item
                    await moveItem(selectedMatchItem.id, 'grocery_list');
                    showToast(`${selectedMatchItem.name} added to grocery list`, 'success');
                } else {
                    // Create new item
                    const newName = document.getElementById('grocery-match-new-name').value.trim() || pendingGroceryItem;
                    const existing = allItems.find(i => i.name.toLowerCase() === newName.toLowerCase());
                    
                    if (existing) {
                        await moveItem(existing.id, 'grocery_list');
                    } else {
                        await fetch(`${API_BASE}/items`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name: newName, location: 'grocery_list' })
                        });
                    }
                    showToast(`${newName} added to grocery list`, 'success');
                }
                
                closeGroceryMatchModal();
                loadGrocery();
                loadAllItems();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }
