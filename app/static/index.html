        // ========== Gemini AI Recipe Suggestions ==========
        async function getGeminiRecipes() {
            const btn = document.getElementById('gemini-recipe-btn');
            const container = document.getElementById('gemini-results');
            const queryInput = document.getElementById('gemini-query-input');
            const query = queryInput.value.trim();

            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Generating...';
            container.innerHTML = '';

            try {
                // Get inventory items
                const invResponse = await fetch(`${API_BASE}/inventory`);
                const invData = await invResponse.json();
                const inventoryItems = invData.items.map(item => item.name);

                if (inventoryItems.length === 0) {
                    throw new Error('Add some items to your inventory first');
                }

                const requestBody = { inventory_items: inventoryItems };
                if (query) {
                    requestBody.query = query;
                }

                const response = await fetch(`${API_BASE}/ai/recipe-suggestions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to generate recipes');
                }

                const data = await response.json();
                renderGeminiRecipes(data.suggestions);
            } catch (err) {
                container.innerHTML = `<p style="color: var(--accent-red); margin-top: 1rem;">${err.message}</p>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '✨ Generate Recipe Ideas';
            }
        }

        function renderGeminiRecipes(recipes) {
            const container = document.getElementById('gemini-results');

            if (!recipes || recipes.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary); margin-top: 1rem;">No recipes generated. Try again.</p>';
                return;
            }

            container.innerHTML = `
                <div class="section-divider">✨ AI Suggestions</div>
                <div style="display: grid; gap: 0.75rem;">
                    ${recipes.map((r, idx) => `
                        <div class="recipe-card gemini-recipe" data-index="${idx}">
                            <h3 style="font-size: 0.95rem; margin: 0 0 0.5rem 0; color: var(--accent-purple);">${r.name}</h3>
                            <p style="font-size: 0.85rem; color: var(--text-secondary); margin: 0 0 0.5rem 0;">${r.description}</p>
                            <div class="recipe-meta" style="margin-bottom: 0.5rem;">
                                ${r.servings} servings
                                ${r.prep_time_minutes ? ` • ${r.prep_time_minutes}min prep` : ''}
                                ${r.cook_time_minutes ? ` • ${r.cook_time_minutes}min cook` : ''}
                            </div>
                            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                                <button class="btn btn-sm" onclick="toggleGeminiDetails(${idx})">View Details</button>
                                <button class="btn btn-sm btn-primary" onclick="saveGeminiRecipe(${idx})">💾 Save Recipe</button>
                            </div>
                            <div class="gemini-details" id="gemini-details-${idx}" style="display: none; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border);">
                                <h4 style="font-size: 0.85rem; margin: 0 0 0.5rem 0;">Ingredients:</h4>
                                <ul style="font-size: 0.85rem; margin: 0 0 0.75rem 1rem;">
                                    ${r.ingredients.map(i => `<li>${i.amount || ''} ${i.unit || ''} ${i.name}${i.notes ? ` (${i.notes})` : ''}</li>`).join('')}
                                </ul>
                                <h4 style="font-size: 0.85rem; margin: 0 0 0.5rem 0;">Steps:</h4>
                                <ol style="font-size: 0.85rem; margin: 0 0 0 1rem;">
                                    ${r.steps.map(s => `<li>${s.instruction}</li>`).join('')}
                                </ol>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            // Store recipes for saving
            window.geminiRecipes = recipes;
        }

        function toggleGeminiDetails(index) {
            const details = document.getElementById(`gemini-details-${index}`);
            details.style.display = details.style.display === 'none' ? 'block' : 'none';
        }

        async function saveGeminiRecipe(index) {
            const recipe = window.geminiRecipes[index];
            if (!recipe) {
                showToast('Recipe not found', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/recipes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(recipe)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to save recipe');
                }

                const saved = await response.json();
                showToast(`Saved: ${saved.name}`, 'success');
                loadRecipes();
                loadFavorites();

                // Navigate to the saved recipe
                window.location.href = `/recipe/${saved.id}`;
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        // ========== Recipe Delete ==========
        async function deleteRecipe(recipeId, recipeName) {
            if (!confirm(`Delete "${recipeName}"? This cannot be undone.`)) return;

            try {
                const response = await fetch(`${API_BASE}/recipes/${recipeId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Failed to delete recipe');

                showToast('Recipe deleted', 'success');
                loadRecipes();
                loadFavorites();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function toggleFavoriteRecipe(recipeId) {
            try {
                const response = await fetch(`${API_BASE}/recipes/${recipeId}/favorite`, {
                    method: 'POST'
                });

                if (!response.ok) throw new Error('Failed to toggle favorite');

                loadRecipes();
                loadFavorites();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }
    </script>
</body>
</html>
