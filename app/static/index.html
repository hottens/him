<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home Inventory Management</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    
    <!-- html5-qrcode library for barcode scanning -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-orange: #d29922;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
            --border-color: #30363d;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Header */
        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        header h1::before {
            content: "📦";
        }

        /* Navigation Tabs */
        .tabs {
            display: flex;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .tab {
            flex: 1;
            padding: 0.75rem 0.5rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        .tab.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
        }

        .tab .count {
            background: var(--bg-tertiary);
            padding: 0.125rem 0.5rem;
            border-radius: 10px;
            font-size: 0.7rem;
            margin-left: 0.25rem;
        }

        .tab.active .count {
            background: var(--accent-blue);
            color: var(--bg-primary);
        }

        /* Sub-tabs */
        .sub-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            background: var(--bg-secondary);
            padding: 0.5rem;
            border-radius: 10px;
        }

        .sub-tab {
            flex: 1;
            padding: 0.5rem 0.75rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .sub-tab:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .sub-tab.active {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .sub-tab .count {
            background: var(--bg-primary);
            padding: 0.1rem 0.4rem;
            border-radius: 8px;
            font-size: 0.7rem;
            margin-left: 0.25rem;
        }

        .sub-panel {
            display: none;
        }

        .sub-panel.active {
            display: block;
        }

        /* Main Content */
        main {
            padding: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        /* Scanner Section */
        #scanner-container {
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-bottom: 1rem;
        }

        #reader {
            width: 100%;
        }

        #reader video {
            border-radius: 12px 12px 0 0;
        }

        .scanner-controls {
            padding: 1rem;
            display: flex;
            gap: 0.5rem;
        }

        .scanner-result {
            padding: 1rem;
            background: var(--bg-tertiary);
            border-top: 1px solid var(--border-color);
            font-family: var(--font-mono);
            font-size: 0.875rem;
        }

        .scanner-result.success {
            border-left: 3px solid var(--accent-green);
        }

        .scanner-result.new {
            border-left: 3px solid var(--accent-orange);
        }

        /* Buttons */
        .btn {
            padding: 0.625rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--bg-secondary);
            border-color: var(--text-secondary);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #fff;
        }

        .btn-primary:hover {
            background: #4c9aed;
            border-color: #4c9aed;
        }

        .btn-success {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: #fff;
        }

        .btn-success:hover {
            background: #36a348;
            border-color: #36a348;
        }

        .btn-warning {
            background: var(--accent-orange);
            border-color: var(--accent-orange);
            color: #fff;
        }

        .btn-warning:hover {
            background: #bf8a1f;
            border-color: #bf8a1f;
        }

        .btn-purple {
            background: var(--accent-purple);
            border-color: var(--accent-purple);
            color: #fff;
        }

        .btn-purple:hover {
            background: #8b5cf6;
            border-color: #8b5cf6;
        }

        .btn-block {
            width: 100%;
        }

        .btn-sm {
            padding: 0.5rem;
            font-size: 1rem;
        }

        /* Item List */
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .item-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            transition: border-color 0.2s;
        }

        .item-card:hover {
            border-color: var(--text-secondary);
        }

        .item-info {
            flex: 1;
            min-width: 0;
        }

        .item-name {
            font-weight: 500;
            margin-bottom: 0.25rem;
            word-break: break-word;
        }

        .item-barcodes {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }

        .item-actions {
            display: flex;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h2 {
            font-size: 1rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.25rem;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .modal-body {
            padding: 1rem;
        }

        /* Forms */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        .form-input, .form-select {
            width: 100%;
            padding: 0.625rem 0.875rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        /* Location Buttons in Modal */
        .location-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .location-buttons .btn {
            flex: 1;
        }

        /* Manual Add Section */
        .manual-add-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .manual-add-section h3 {
            font-size: 0.9rem;
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }

        .manual-add-row {
            display: flex;
            gap: 0.5rem;
        }

        .manual-add-row .form-input {
            flex: 1;
        }

        /* Search Results */
        .search-results {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-tertiary);
        }

        .search-result-item {
            padding: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.15s;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item:hover {
            background: var(--bg-secondary);
        }

        .search-result-item.selected {
            background: var(--accent-blue);
            color: #fff;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 1rem;
            left: 1rem;
            right: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 2000;
            pointer-events: none;
        }

        .toast {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.875rem 1rem;
            font-size: 0.875rem;
            animation: slideUp 0.3s ease-out;
            pointer-events: auto;
        }

        .toast.success {
            border-left: 3px solid var(--accent-green);
        }

        .toast.error {
            border-left: 3px solid var(--accent-red);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(1rem);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mode Indicator */
        .scan-mode {
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .scan-mode-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .scan-mode-value {
            font-weight: 600;
            font-size: 0.875rem;
        }

        .scan-mode-value.inventory {
            color: var(--accent-green);
        }

        .scan-mode-value.grocery {
            color: var(--accent-orange);
        }

        /* Mode Selection Buttons */
        .mode-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .mode-buttons .btn {
            flex: 1;
        }

        .mode-buttons .btn.active {
            box-shadow: 0 0 0 2px var(--bg-primary), 0 0 0 4px currentColor;
        }

        /* Recipe Card */
        .recipe-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .recipe-card:hover {
            border-color: var(--accent-purple);
        }

        .recipe-card h3 {
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }

        .recipe-card .recipe-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .recipe-card .favorite-star {
            color: var(--accent-orange);
        }

        .recipe-card .ingredient-status {
            margin-top: 0.5rem;
            padding: 0.5rem;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .recipe-card .ingredient-status.complete {
            background: rgba(63, 185, 80, 0.15);
            color: var(--accent-green);
        }

        .recipe-card .ingredient-status.partial {
            background: rgba(210, 153, 34, 0.15);
            color: var(--accent-orange);
        }

        .recipe-card .ingredient-status.missing {
            background: rgba(248, 81, 73, 0.15);
            color: var(--accent-red);
        }

        /* AI Suggestion Box */
        .ai-section {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary));
            border: 1px solid var(--accent-purple);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .ai-section h3 {
            color: var(--accent-purple);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .suggestion-card {
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.5rem;
        }

        .suggestion-card h4 {
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
        }

        .suggestion-card p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Loading spinner */
        .loading {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid var(--text-secondary);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Section Divider */
        .section-divider {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin: 1.5rem 0 1rem;
            position: relative;
        }

        .section-divider::before,
        .section-divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background: var(--border-color);
        }

        .section-divider::before { left: 0; }
        .section-divider::after { right: 0; }

        /* Recipe Filter Bar */
        .recipe-filter-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .recipe-filter-bar .form-input {
            flex: 1;
        }

        .recipe-fav-filter.active {
            background: var(--accent-orange);
            border-color: var(--accent-orange);
            color: #fff;
        }

        /* Responsive adjustments */
        @media (max-width: 400px) {
            .item-actions {
                flex-direction: column;
            }
            .tab {
                font-size: 0.75rem;
                padding: 0.75rem 0.25rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Home Inventory Management</h1>
    </header>

    <nav class="tabs">
        <button class="tab active" data-panel="items">📦 Items<span class="count" id="items-count">0</span></button>
        <button class="tab" data-panel="recipes">🍳 Recepten<span class="count" id="recipes-count">0</span></button>
    </nav>

    <main>
        <!-- Items Panel (Voorraad + Boodschappen) -->
        <div id="items" class="panel active">
            <!-- Sub-tabs for Voorraad/Boodschappen -->
            <div class="sub-tabs">
                <button class="sub-tab active" data-subtab="grocery-section">🛒 Boodschappen<span class="count" id="grocery-count">0</span></button>
                <button class="sub-tab" data-subtab="inventory-section">🏠 Voorraad<span class="count" id="inventory-count">0</span></button>
            </div>

            <!-- Boodschappen Section -->
            <div id="grocery-section" class="sub-panel active">
                <div class="manual-add-section">
                    <div class="manual-add-row">
                        <input type="text" class="form-input" id="grocery-add-input" 
                               placeholder="Toevoegen aan boodschappenlijst..." list="items-datalist">
                        <datalist id="items-datalist"></datalist>
                        <button class="btn btn-warning" onclick="quickAddToGrocery()">Toevoegen</button>
                        <button class="btn btn-sm" onclick="openScanner('grocery_list')" title="Scannen">📷</button>
                    </div>
                </div>
                
                <div id="grocery-list" class="item-list"></div>
            </div>

            <!-- Voorraad Section -->
            <div id="inventory-section" class="sub-panel">
                <div class="manual-add-section">
                    <div class="manual-add-row">
                        <input type="text" class="form-input" id="inventory-add-input" 
                               placeholder="Toevoegen aan voorraad..." list="items-datalist">
                        <button class="btn btn-success" onclick="quickAddToInventory()">Toevoegen</button>
                        <button class="btn btn-sm" onclick="openScanner('inventory')" title="Scannen">📷</button>
                    </div>
                </div>
                
                <div id="inventory-list" class="item-list"></div>
            </div>
        </div>

        <!-- Recepten Panel -->
        <div id="recipes" class="panel">
            <div class="manual-add-section">
                <h3 style="font-size: 0.9rem; margin-bottom: 0.75rem; color: var(--text-secondary);">📎 Importeren via URL</h3>
                <div class="manual-add-row">
                    <input type="text" class="form-input" id="recipe-url-input" 
                           placeholder="Plak recept-URL...">
                    <button class="btn btn-primary" onclick="importRecipeFromUrl()" id="import-url-btn">Importeren</button>
                </div>
            </div>

            <div class="recipe-filter-bar">
                <input type="text" class="form-input" id="recipe-search-input" placeholder="Zoek recepten...">
                <button class="btn recipe-fav-filter" id="recipe-fav-filter" onclick="toggleFavFilter()" title="Alleen favorieten">☆</button>
            </div>

            <div id="recipe-list"></div>
        </div>
    </main>

    <!-- Scanner Modal -->
    <div class="modal-overlay" id="scanner-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>Scannen</h2>
                <button class="modal-close" onclick="closeScanner()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="scan-mode">
                    <span class="scan-mode-label">Toevoegen aan:</span>
                    <span class="scan-mode-value inventory" id="current-mode">Voorraad</span>
                </div>

                <div id="scanner-container">
                    <div id="reader"></div>
                    <div class="scanner-controls">
                        <button class="btn btn-primary btn-block" id="start-scanner" onclick="toggleScanner()">
                            📷 Start scanner
                        </button>
                    </div>
                    <div id="scanner-result" class="scanner-result" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- New Item Modal -->
    <div class="modal-overlay" id="new-item-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>Nieuwe barcode gescand</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Barcode</label>
                    <input type="text" class="form-input" id="modal-barcode" readonly>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Naam</label>
                    <input type="text" class="form-input" id="modal-item-name" 
                           placeholder="Voer een naam in of zoek bestaand item...">
                    <div class="search-results" id="search-results" style="display: none;"></div>
                </div>

                <div class="location-buttons">
                    <button class="btn btn-success" onclick="createItem('inventory')">🏠 Voorraad</button>
                    <button class="btn btn-warning" onclick="createItem('grocery_list')">🛒 Boodschappen</button>
                    <button class="btn" onclick="createItem('neither')">📦 Archief</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Item Modal -->
    <div class="modal-overlay" id="edit-item-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>Item bewerken</h2>
                <button class="modal-close" onclick="closeEditItemModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Naam</label>
                    <input type="text" class="form-input" id="edit-item-name">
                </div>
                <div class="form-group">
                    <label class="form-label">Locatie</label>
                    <select class="form-select" id="edit-item-location">
                        <option value="inventory">🏠 Voorraad</option>
                        <option value="grocery_list">🛒 Boodschappenlijst</option>
                        <option value="neither">📦 Archief</option>
                    </select>
                </div>
                <div class="location-buttons">
                    <button class="btn btn-danger" onclick="deleteEditingItem()" style="background: var(--accent-red); border-color: var(--accent-red);">Verwijderen</button>
                    <button class="btn" onclick="closeEditItemModal()">Annuleren</button>
                    <button class="btn btn-primary" onclick="saveEditingItem()">Opslaan</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        // State
        let html5QrCode = null;
        let isScanning = false;
        let currentScanMode = 'inventory'; // 'inventory' or 'grocery_list'
        let pendingBarcode = null;
        let selectedExistingItem = null;
        let allItems = [];
        let allRecipes = [];
        let inventoryNames = new Set();
        let inventoryItemIds = new Set();
        let recipeSearchQuery = '';
        let favFilterActive = false;
        // API base URL
        const API_BASE = '/api';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Set up tab navigation
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => switchPanel(tab.dataset.panel));
            });

            // Set up sub-tab navigation
            document.querySelectorAll('.sub-tab').forEach(tab => {
                tab.addEventListener('click', () => switchSubPanel(tab));
            });

            // Set up item name search in modal
            const itemNameInput = document.getElementById('modal-item-name');
            let searchTimeout;
            itemNameInput.addEventListener('input', () => {
                clearTimeout(searchTimeout);
                selectedExistingItem = null;
                searchTimeout = setTimeout(() => searchItems(itemNameInput.value), 300);
            });

            // Handle Enter key for manual inputs
            document.getElementById('inventory-add-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') quickAddToInventory();
            });
            document.getElementById('grocery-add-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') quickAddToGrocery();
            });
            document.getElementById('recipe-url-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') importRecipeFromUrl();
            });

            // Recipe search filter
            document.getElementById('recipe-search-input').addEventListener('input', (e) => {
                recipeSearchQuery = e.target.value.trim().toLowerCase();
                renderRecipes();
            });

            // Restore the requested tab (e.g. returning from a recipe page)
            const requestedTab = new URLSearchParams(window.location.search).get('tab');
            if (requestedTab === 'recipes') {
                switchPanel('recipes');
            }

            // Load initial data
            loadInventory();
            loadGrocery();
            loadAllItems();
            loadRecipes();
        });

        // Panel Navigation
        function switchPanel(panelId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            
            document.querySelector(`[data-panel="${panelId}"]`).classList.add('active');
            document.getElementById(panelId).classList.add('active');
        }

        // Sub-panel Navigation
        function switchSubPanel(tabElement) {
            const container = tabElement.closest('.panel');
            const subtabId = tabElement.dataset.subtab;
            
            // Update sub-tab styles
            container.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
            tabElement.classList.add('active');
            
            // Show/hide sub-panels
            container.querySelectorAll('.sub-panel').forEach(p => p.classList.remove('active'));
            document.getElementById(subtabId).classList.add('active');
        }

        // Update combined counts
        function updateItemsCount() {
            const inventory = parseInt(document.getElementById('inventory-count').textContent) || 0;
            const grocery = parseInt(document.getElementById('grocery-count').textContent) || 0;
            document.getElementById('items-count').textContent = inventory + grocery;
        }

        function updateRecipesCount() {
            document.getElementById('recipes-count').textContent = allRecipes.length;
        }

        // Scanner Modal
        function openScanner(mode) {
            currentScanMode = mode;
            const modeIndicator = document.getElementById('current-mode');
            if (mode === 'inventory') {
                modeIndicator.textContent = 'Voorraad';
                modeIndicator.className = 'scan-mode-value inventory';
            } else {
                modeIndicator.textContent = 'Boodschappenlijst';
                modeIndicator.className = 'scan-mode-value grocery';
            }
            document.getElementById('scanner-result').style.display = 'none';
            document.getElementById('scanner-modal').classList.add('active');
            startScanner();
        }

        async function closeScanner() {
            await stopScanner();
            document.getElementById('scanner-modal').classList.remove('active');
        }

        // Scanner Functions
        async function toggleScanner() {
            if (isScanning) {
                await stopScanner();
            } else {
                await startScanner();
            }
        }

        async function startScanner() {
            const btn = document.getElementById('start-scanner');
            
            try {
                html5QrCode = new Html5Qrcode("reader");
                
                await html5QrCode.start(
                    { facingMode: "environment" },
                    {
                        fps: 10,
                        qrbox: { width: 250, height: 100 },
                        aspectRatio: 1.0
                    },
                    onScanSuccess,
                    onScanFailure
                );
                
                isScanning = true;
                btn.textContent = '⏹ Stop scanner';
                btn.classList.remove('btn-primary');
            } catch (err) {
                console.error('Failed to start scanner:', err);
                showToast('Cameratoegang mislukt. Probeer HTTPS of controleer de rechten.', 'error');
            }
        }

        async function stopScanner() {
            const btn = document.getElementById('start-scanner');
            
            if (html5QrCode && isScanning) {
                try {
                    await html5QrCode.stop();
                } catch (err) {
                    console.error('Error stopping scanner:', err);
                }
            }
            
            isScanning = false;
            btn.textContent = '📷 Start scanner';
            btn.classList.add('btn-primary');
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (navigator.vibrate) navigator.vibrate(100);
            lookupBarcode(decodedText);
        }

        function onScanFailure(error) {}

        // Barcode Lookup
        async function lookupBarcode(code) {
            const resultDiv = document.getElementById('scanner-result');
            resultDiv.style.display = 'block';
            resultDiv.textContent = `Opzoeken: ${code}...`;
            resultDiv.className = 'scanner-result';

            try {
                const response = await fetch(`${API_BASE}/scan`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, location: currentScanMode })
                });
                const data = await response.json();
                const targetLabel = currentScanMode === 'inventory' ? 'Voorraad' : 'Boodschappenlijst';

                if (data.needs_manual) {
                    resultDiv.innerHTML = `⚠ Nieuwe barcode: <strong>${code}</strong>`;
                    resultDiv.className = 'scanner-result new';
                    showNewItemModal(code);
                    return;
                }

                const item = data.item;
                const nutri = item.nutri_score ? ` · Nutri-Score ${item.nutri_score}` : '';
                if (data.created) {
                    resultDiv.innerHTML = `✨ Toegevoegd via Open Food Facts: <strong>${item.name}</strong>${nutri}`;
                } else {
                    resultDiv.innerHTML = `✓ Gevonden: <strong>${item.name}</strong>${nutri}`;
                }
                resultDiv.className = 'scanner-result success';
                showToast(`${item.name} → ${targetLabel}`, 'success');

                loadInventory();
                loadGrocery();
                loadAllItems();
            } catch (err) {
                resultDiv.textContent = `Fout: ${err.message}`;
                showToast('Barcode opzoeken mislukt', 'error');
            }
        }

        // Modal Functions
        function showNewItemModal(barcode) {
            pendingBarcode = barcode;
            selectedExistingItem = null;
            
            document.getElementById('modal-barcode').value = barcode;
            document.getElementById('modal-item-name').value = '';
            document.getElementById('search-results').style.display = 'none';
            document.getElementById('new-item-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('new-item-modal').classList.remove('active');
            pendingBarcode = null;
            selectedExistingItem = null;
        }

        async function searchItems(query) {
            const resultsDiv = document.getElementById('search-results');
            
            if (!query || query.length < 2) {
                resultsDiv.style.display = 'none';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/search?q=${encodeURIComponent(query)}`);
                const items = await response.json();

                if (items.length === 0) {
                    resultsDiv.style.display = 'none';
                    return;
                }

                resultsDiv.innerHTML = items.map(item => `
                    <div class="search-result-item" onclick="selectExistingItem(${item.id}, '${item.name.replace(/'/g, "\\'")}')">
                        ${item.name}
                        <small style="color: var(--text-secondary); display: block;">
                            ${item.location === 'inventory' ? '🏠 Voorraad' : 
                              item.location === 'grocery_list' ? '🛒 Boodschappen' : 
                              '📦 Archief'}
                        </small>
                    </div>
                `).join('');
                resultsDiv.style.display = 'block';
            } catch (err) {
                console.error('Error searching items:', err);
            }
        }

        function selectExistingItem(id, name) {
            selectedExistingItem = { id, name };
            document.getElementById('modal-item-name').value = name;
            document.getElementById('search-results').style.display = 'none';
        }

        async function createItem(location) {
            const itemName = document.getElementById('modal-item-name').value.trim();
            
            if (!itemName) {
                showToast('Voer een naam in', 'error');
                return;
            }

            try {
                if (selectedExistingItem) {
                    await fetch(`${API_BASE}/barcode/associate`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            barcode: pendingBarcode,
                            item_id: selectedExistingItem.id
                        })
                    });
                    
                    await moveItem(selectedExistingItem.id, location);
                    showToast(`Barcode toegevoegd aan ${selectedExistingItem.name}`, 'success');
                } else {
                    const response = await fetch(`${API_BASE}/items`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: itemName,
                            location: location,
                            barcode: pendingBarcode
                        })
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.detail || 'Item aanmaken mislukt');
                    }

                    showToast(`Aangemaakt: ${itemName}`, 'success');
                }

                closeModal();
                loadInventory();
                loadGrocery();
                loadAllItems();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function quickAddToInventory() {
            const input = document.getElementById('inventory-add-input');
            const itemName = input.value.trim();
            if (!itemName) return;

            const existing = allItems.find(i => i.name.toLowerCase() === itemName.toLowerCase());
            
            try {
                if (existing) {
                    await moveItem(existing.id, 'inventory');
                } else {
                    await fetch(`${API_BASE}/items`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: itemName, location: 'inventory' })
                    });
                }
                
                input.value = '';
                showToast(`${itemName} toegevoegd aan voorraad`, 'success');
                loadInventory();
                loadGrocery();
                loadAllItems();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function quickAddToGrocery() {
            const input = document.getElementById('grocery-add-input');
            const itemName = input.value.trim();
            if (!itemName) return;

            const existing = allItems.find(i => i.name.toLowerCase() === itemName.toLowerCase());
            
            try {
                if (existing) {
                    await moveItem(existing.id, 'grocery_list');
                } else {
                    await fetch(`${API_BASE}/items`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: itemName, location: 'grocery_list' })
                    });
                }
                
                input.value = '';
                showToast(`${itemName} toegevoegd aan boodschappenlijst`, 'success');
                loadInventory();
                loadGrocery();
                loadAllItems();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        function getLocationLabel(location) {
            const labels = {
                'inventory': '🏠 Voorraad',
                'grocery_list': '🛒 Boodschappen',
                'neither': '📦 Archief'
            };
            return labels[location] || location;
        }

        // Item Management
        async function moveItem(itemId, location) {
            const endpoint = location === 'inventory' ? 'to-inventory' : 
                            location === 'grocery_list' ? 'to-grocery' : 'remove';
            
            await fetch(`${API_BASE}/items/${itemId}/${endpoint}`, { method: 'POST' });
            loadInventory();
            loadGrocery();
        }

        async function removeItem(itemId) {
            await fetch(`${API_BASE}/items/${itemId}/remove`, { method: 'POST' });
            showToast('Item gearchiveerd', 'success');
            loadInventory();
            loadGrocery();
        }

        // Load Lists
        async function loadAllItems() {
            try {
                const response = await fetch(`${API_BASE}/items`);
                allItems = await response.json();
                
                // Update datalist
                const datalist = document.getElementById('items-datalist');
                datalist.innerHTML = allItems.map(item => 
                    `<option value="${item.name}">`
                ).join('');
            } catch (err) {
                console.error('Error loading items:', err);
            }
        }

        async function loadInventory() {
            try {
                const response = await fetch(`${API_BASE}/inventory`);
                const data = await response.json();
                
                document.getElementById('inventory-count').textContent = data.count;
                updateItemsCount();

                // Keep inventory names + ids for recipe availability calculations
                inventoryNames = new Set(data.items.map(item => item.name.toLowerCase()));
                inventoryItemIds = new Set(data.items.map(item => item.id));
                renderRecipes();
                
                const listDiv = document.getElementById('inventory-list');
                if (data.items.length === 0) {
                    listDiv.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">🏠</div>
                            <p>Geen items in voorraad</p>
                        </div>
                    `;
                } else {
                    listDiv.innerHTML = data.items.map(item => renderItemCard(item, 'inventory')).join('');
                }
            } catch (err) {
                console.error('Error loading inventory:', err);
            }
        }

        async function loadGrocery() {
            try {
                const response = await fetch(`${API_BASE}/grocery`);
                const data = await response.json();
                
                document.getElementById('grocery-count').textContent = data.count;
                updateItemsCount();
                
                const listDiv = document.getElementById('grocery-list');
                if (data.items.length === 0) {
                    listDiv.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">🛒</div>
                            <p>Boodschappenlijst is leeg</p>
                        </div>
                    `;
                } else {
                    listDiv.innerHTML = data.items.map(item => renderItemCard(item, 'grocery')).join('');
                }
            } catch (err) {
                console.error('Error loading grocery list:', err);
            }
        }

        function renderItemCard(item, currentList) {
            const barcodes = item.barcodes.map(b => b.code).join(', ');

            const meta = [];
            if (item.nutri_score) meta.push(`Nutri-Score ${item.nutri_score}`);
            if (item.allergens) meta.push(`⚠ ${item.allergens}`);
            const metaHtml = meta.length
                ? `<div class="item-barcodes">${meta.join(' · ')}</div>`
                : '';

            return `
                <div class="item-card">
                    <div class="item-info" onclick="openEditItemModal(${item.id}, '${item.name.replace(/'/g, "\\'")}', '${item.location}')" style="cursor: pointer;">
                        <div class="item-name">${item.name}</div>
                        ${metaHtml}
                        ${barcodes ? `<div class="item-barcodes">${barcodes}</div>` : ''}
                    </div>
                    <div class="item-actions">
                        ${currentList === 'inventory' ? `
                            <button class="btn btn-warning btn-sm" onclick="moveItem(${item.id}, 'grocery_list')" title="Naar boodschappen">🛒</button>
                        ` : `
                            <button class="btn btn-success btn-sm" onclick="moveItem(${item.id}, 'inventory')" title="Naar voorraad">🏠</button>
                        `}
                        <button class="btn btn-sm" onclick="removeItem(${item.id})" title="Archiveren">📦</button>
                        <button class="btn btn-sm" onclick="openEditItemModal(${item.id}, '${item.name.replace(/'/g, "\\'")}', '${item.location}')" title="Bewerken">✏️</button>
                    </div>
                </div>
            `;
        }

        // Recipe Functions
        async function loadRecipes() {
            try {
                const response = await fetch(`${API_BASE}/recipes`);
                const data = await response.json();
                allRecipes = data.recipes;
                updateRecipesCount();
                renderRecipes();
            } catch (err) {
                console.error('Error loading recipes:', err);
            }
        }

        // Compute how many ingredients are available in inventory.
        // Mirror the recipe detail page: prefer the linked item_id, fall back to name.
        function recipeAvailability(recipe) {
            const ingredients = recipe.ingredients || [];
            const total = ingredients.length;
            const available = ingredients.filter(ing =>
                ing.item_id
                    ? inventoryItemIds.has(ing.item_id)
                    : inventoryNames.has(ing.name.toLowerCase())
            ).length;
            const percentage = total > 0 ? available / total : 0;
            return { total, available, percentage };
        }

        function renderRecipes() {
            const listDiv = document.getElementById('recipe-list');
            if (!listDiv) return;

            // Filter by search text and favorite toggle
            let recipes = allRecipes.filter(r => {
                if (favFilterActive && !r.is_favorite) return false;
                if (recipeSearchQuery && !r.name.toLowerCase().includes(recipeSearchQuery)) return false;
                return true;
            });

            // Sort by percentage of ingredients in stock (descending)
            recipes = recipes
                .map(r => ({ recipe: r, avail: recipeAvailability(r) }))
                .sort((a, b) => b.avail.percentage - a.avail.percentage);

            if (recipes.length === 0) {
                const emptyText = allRecipes.length === 0
                    ? 'Nog geen recepten opgeslagen'
                    : 'Geen recepten gevonden';
                listDiv.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📖</div>
                        <p>${emptyText}</p>
                        ${allRecipes.length === 0 ? '<p style="font-size: 0.85rem; margin-top: 0.5rem;">Importeer een recept via URL hierboven.</p>' : ''}
                    </div>
                `;
                return;
            }

            listDiv.innerHTML = recipes.map(({ recipe, avail }) => {
                const { total, available, percentage } = avail;
                let statusClass, statusText;
                if (total === 0) {
                    statusClass = 'partial';
                    statusText = 'Geen ingrediënten opgegeven';
                } else if (available === total) {
                    statusClass = 'complete';
                    statusText = `✓ Alle ${total} ingrediënten in voorraad (100%)`;
                } else if (available === 0) {
                    statusClass = 'missing';
                    statusText = `✗ 0/${total} ingrediënten in voorraad (0%)`;
                } else {
                    statusClass = 'partial';
                    statusText = `◐ ${available}/${total} ingrediënten in voorraad (${Math.round(percentage * 100)}%)`;
                }

                return `
                    <div class="recipe-card" style="display: flex; justify-content: space-between; align-items: flex-start;">
                        <div onclick="window.location.href='/recipe/${recipe.id}'" style="flex: 1; cursor: pointer;">
                            <h3>
                                ${recipe.is_favorite ? '<span class="favorite-star">★</span> ' : ''}
                                ${recipe.name}
                            </h3>
                            <div class="recipe-meta">
                                ${recipe.servings} porties
                                ${recipe.prep_time_minutes ? ` • ${recipe.prep_time_minutes} min voorbereiding` : ''}
                                ${recipe.cook_time_minutes ? ` • ${recipe.cook_time_minutes} min koken` : ''}
                            </div>
                            <div class="ingredient-status ${statusClass}">
                                ${statusText}
                            </div>
                        </div>
                        <div style="display: flex; gap: 0.5rem; flex-shrink: 0;" onclick="event.stopPropagation();">
                            <button class="btn btn-sm" onclick="window.location.href='/recipe/${recipe.id}?edit=1'" title="Bewerken">✏️</button>
                            <button class="btn btn-sm" onclick="toggleFavoriteRecipe(${recipe.id})" title="${recipe.is_favorite ? 'Verwijder favoriet' : 'Maak favoriet'}">${recipe.is_favorite ? '★' : '☆'}</button>
                            <button class="btn btn-sm" onclick="deleteRecipe(${recipe.id}, '${recipe.name.replace(/'/g, "\\'")}')" title="Verwijderen" style="color: var(--accent-red);">🗑</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleFavFilter() {
            favFilterActive = !favFilterActive;
            const btn = document.getElementById('recipe-fav-filter');
            btn.classList.toggle('active', favFilterActive);
            btn.textContent = favFilterActive ? '★' : '☆';
            renderRecipes();
        }

        // Toast Notifications
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => toast.remove(), 3000);
        }

        // ========== Edit Item Modal ==========
        let editingItemId = null;

        function openEditItemModal(id, name, location) {
            editingItemId = id;
            document.getElementById('edit-item-name').value = name;
            document.getElementById('edit-item-location').value = location;
            document.getElementById('edit-item-modal').classList.add('active');
        }

        function closeEditItemModal() {
            document.getElementById('edit-item-modal').classList.remove('active');
            editingItemId = null;
        }

        async function saveEditingItem() {
            if (!editingItemId) return;

            const name = document.getElementById('edit-item-name').value.trim();
            const location = document.getElementById('edit-item-location').value;

            if (!name) {
                showToast('Naam mag niet leeg zijn', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/items/${editingItemId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, location })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail);
                }

                showToast('Item bijgewerkt', 'success');
                closeEditItemModal();
                loadInventory();
                loadGrocery();
                loadAllItems();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function deleteEditingItem() {
            if (!editingItemId) return;

            if (!confirm('Weet je zeker dat je dit item wilt verwijderen? Dit kan niet ongedaan worden gemaakt.')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/items/${editingItemId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Item verwijderen mislukt');
                }

                showToast('Item verwijderd', 'success');
                closeEditItemModal();
                loadInventory();
                loadGrocery();
                loadAllItems();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        // ========== Recipe Delete ==========
        async function deleteRecipe(recipeId, recipeName) {
            if (!confirm(`"${recipeName}" verwijderen? Dit kan niet ongedaan worden gemaakt.`)) return;

            try {
                const response = await fetch(`${API_BASE}/recipes/${recipeId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Recept verwijderen mislukt');

                showToast('Recept verwijderd', 'success');
                loadRecipes();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function toggleFavoriteRecipe(recipeId) {
            try {
                const response = await fetch(`${API_BASE}/recipes/${recipeId}/favorite`, {
                    method: 'POST'
                });

                if (!response.ok) throw new Error('Favoriet wijzigen mislukt');

                loadRecipes();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        // ========== Import Recipe from URL ==========
        async function importRecipeFromUrl() {
            const input = document.getElementById('recipe-url-input');
            const btn = document.getElementById('import-url-btn');
            const url = input.value.trim();

            if (!url) {
                showToast('Voer een recept-URL in', 'error');
                return;
            }

            // Basic URL validation
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                showToast('Voer een geldige URL in', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>';

            try {
                const response = await fetch(`${API_BASE}/recipes/import-url`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Recept importeren mislukt');
                }

                const recipe = await response.json();
                showToast(`Geïmporteerd: ${recipe.name}`, 'success');
                input.value = '';
                loadRecipes();
                
                // Navigate to the recipe
                window.location.href = `/recipe/${recipe.id}`;
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Importeren';
            }
        }
    </script>
</body>
</html>
