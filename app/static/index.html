<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home Inventory Management</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    
    <!-- html5-qrcode library for barcode scanning -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-orange: #d29922;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
            --border-color: #30363d;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Header */
        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        header h1::before {
            content: "📦";
        }

        .settings-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            opacity: 0.6;
            transition: opacity 0.2s, color 0.2s;
            line-height: 1;
        }

        .settings-btn:hover {
            opacity: 1;
            color: var(--text-primary);
        }

        .kiosk-only {
            display: none;
        }

        body.kiosk .emoji {
            display: none;
        }

        body.kiosk .kiosk-only {
            display: inline;
        }

        body.kiosk .no-kiosk {
            display: none !important;
        }

        body.kiosk header h1::before {
            content: none;
        }

        body.kiosk .empty-state-icon {
            display: none;
        }

        body.kiosk .item-info {
            cursor: default !important;
        }

        /* Navigation Tabs */
        .tabs {
            display: flex;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .tab {
            flex: 1;
            padding: 0.75rem 0.5rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        .tab.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
        }

        .tab .count {
            background: var(--bg-tertiary);
            padding: 0.125rem 0.5rem;
            border-radius: 10px;
            font-size: 0.7rem;
            margin-left: 0.25rem;
        }

        .tab.active .count {
            background: var(--accent-blue);
            color: var(--bg-primary);
        }

        /* Sub-tabs */
        .sub-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            background: var(--bg-secondary);
            padding: 0.5rem;
            border-radius: 10px;
        }

        .sub-tab {
            flex: 1;
            padding: 0.5rem 0.75rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .sub-tab:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .sub-tab.active {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .sub-tab .count {
            background: var(--bg-primary);
            padding: 0.1rem 0.4rem;
            border-radius: 8px;
            font-size: 0.7rem;
            margin-left: 0.25rem;
        }

        .sub-panel {
            display: none;
        }

        .sub-panel.active {
            display: block;
        }

        /* Main Content */
        main {
            padding: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        /* Scanner Section */
        #scanner-container {
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-bottom: 1rem;
        }

        #reader {
            width: 100%;
        }

        #reader video {
            border-radius: 12px 12px 0 0;
        }

        .scanner-controls {
            padding: 1rem;
            display: flex;
            gap: 0.5rem;
        }

        .scanner-result {
            padding: 1rem;
            background: var(--bg-tertiary);
            border-top: 1px solid var(--border-color);
            font-family: var(--font-mono);
            font-size: 0.875rem;
        }

        .scanner-result.success {
            border-left: 3px solid var(--accent-green);
        }

        .scanner-result.new {
            border-left: 3px solid var(--accent-orange);
        }

        /* Buttons */
        .btn {
            padding: 0.625rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--bg-secondary);
            border-color: var(--text-secondary);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #fff;
        }

        .btn-primary:hover {
            background: #4c9aed;
            border-color: #4c9aed;
        }

        .btn-success {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: #fff;
        }

        .btn-success:hover {
            background: #36a348;
            border-color: #36a348;
        }

        .btn-warning {
            background: var(--accent-orange);
            border-color: var(--accent-orange);
            color: #fff;
        }

        .btn-warning:hover {
            background: #bf8a1f;
            border-color: #bf8a1f;
        }

        .btn-purple {
            background: var(--accent-purple);
            border-color: var(--accent-purple);
            color: #fff;
        }

        .btn-purple:hover {
            background: #8b5cf6;
            border-color: #8b5cf6;
        }

        .btn-block {
            width: 100%;
        }

        .btn-sm {
            padding: 0.35rem 0.55rem;
            font-size: 0.75rem;
            white-space: nowrap;
        }

        /* Item List */
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .item-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            transition: border-color 0.2s;
        }

        .item-card:hover {
            border-color: var(--text-secondary);
        }

        .item-info {
            flex: 1;
            min-width: 0;
        }

        .item-name {
            font-weight: 500;
            margin-bottom: 0.25rem;
            word-break: break-word;
        }

        .item-product {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.125rem;
        }

        .item-barcodes {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }

        .item-actions {
            display: flex;
            gap: 0.35rem;
            flex-shrink: 0;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h2 {
            font-size: 1rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.25rem;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .modal-body {
            padding: 1rem;
        }

        /* Forms */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        .form-input, .form-select {
            width: 100%;
            padding: 0.625rem 0.875rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        /* Location Buttons in Modal */
        .location-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .location-buttons .btn {
            flex: 1;
        }

        /* Manual Add Section */
        .manual-add-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .manual-add-section h3 {
            font-size: 0.9rem;
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }

        .manual-add-row {
            display: flex;
            gap: 0.5rem;
        }

        .manual-add-row .form-input {
            flex: 1;
        }

        /* Search Results */
        .search-results {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-tertiary);
        }

        .search-result-item {
            padding: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.15s;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item:hover {
            background: var(--bg-secondary);
        }

        .search-result-item.selected {
            background: var(--accent-blue);
            color: #fff;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 1rem;
            left: 1rem;
            right: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 2000;
            pointer-events: none;
        }

        .toast {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.875rem 1rem;
            font-size: 0.875rem;
            animation: slideUp 0.3s ease-out;
            pointer-events: auto;
        }

        .toast.success {
            border-left: 3px solid var(--accent-green);
        }

        .toast.error {
            border-left: 3px solid var(--accent-red);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(1rem);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mode Indicator */
        .scan-mode {
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .scan-mode-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .scan-mode-value {
            font-weight: 600;
            font-size: 0.875rem;
        }

        .scan-mode-value.inventory {
            color: var(--accent-green);
        }

        .scan-mode-value.grocery {
            color: var(--accent-orange);
        }

        /* Mode Selection Buttons */
        .mode-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .mode-buttons .btn {
            flex: 1;
        }

        .mode-buttons .btn.active {
            box-shadow: 0 0 0 2px var(--bg-primary), 0 0 0 4px currentColor;
        }

        /* Recipe Card */
        .recipe-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            scroll-margin-top: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .recipe-card:hover {
            border-color: var(--accent-purple);
        }

        .recipe-card.highlighted {
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 2px rgba(163, 113, 247, 0.35);
        }

        .recipe-card h3 {
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }

        .recipe-card .recipe-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .recipe-card .favorite-star {
            color: var(--accent-orange);
        }

        .recipe-card .ingredient-status {
            margin-top: 0.5rem;
            padding: 0.5rem;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .recipe-card .ingredient-status.complete {
            background: rgba(63, 185, 80, 0.15);
            color: var(--accent-green);
        }

        .recipe-card .ingredient-status.partial {
            background: rgba(210, 153, 34, 0.15);
            color: var(--accent-orange);
        }

        .recipe-card .ingredient-status.missing {
            background: rgba(248, 81, 73, 0.15);
            color: var(--accent-red);
        }

        /* Recipe Filter Bar */
        .recipe-filter-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .recipe-filter-bar .form-input {
            flex: 1;
        }

        .recipe-fav-filter.active {
            background: var(--accent-orange);
            border-color: var(--accent-orange);
            color: #fff;
        }

        /* AI Suggestion Box */
        .ai-section {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary));
            border: 1px solid var(--accent-purple);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .ai-section h3 {
            color: var(--accent-purple);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .suggestion-card {
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.5rem;
        }

        .suggestion-card h4 {
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
        }

        .suggestion-card p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Loading spinner */
        .loading {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid var(--text-secondary);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Section Divider */
        .section-divider {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin: 1.5rem 0 1rem;
            position: relative;
        }

        .section-divider::before,
        .section-divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background: var(--border-color);
        }

        .section-divider::before { left: 0; }
        .section-divider::after { right: 0; }

        /* Settings */
        .settings-toggle {
            margin-bottom: 1rem;
        }

        .settings-toggle-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            font-size: 0.875rem;
            cursor: pointer;
        }

        .settings-toggle-label input[type="checkbox"] {
            width: 1.125rem;
            height: 1.125rem;
            accent-color: var(--accent-blue);
            flex-shrink: 0;
        }

        .settings-status {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        .settings-status.ok {
            color: var(--accent-green);
        }

        .settings-status.warn {
            color: var(--accent-orange);
        }

        /* Barcode list (edit modal) */
        .barcode-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .barcode-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding: 0.625rem 0.75rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .barcode-row:hover {
            border-color: var(--text-secondary);
        }

        .barcode-row.active {
            border-color: var(--accent-blue);
        }

        .barcode-code {
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }

        .barcode-product {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.125rem;
        }

        .barcode-badge {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--accent-blue);
            background: rgba(88, 166, 255, 0.15);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            margin-left: 0.5rem;
        }

        .barcode-row-main {
            min-width: 0;
            flex: 1;
        }

        .barcode-row-actions {
            display: flex;
            gap: 0.35rem;
            flex-shrink: 0;
        }

        .recipe-nutrition-preview {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem 0.75rem;
        }

        .recipe-nutrition-preview strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .nutrient-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        @media (max-width: 480px) {
            .nutrient-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Responsive adjustments */
        @media (max-width: 400px) {
            .item-actions {
                flex-direction: column;
            }
            .tab {
                font-size: 0.75rem;
                padding: 0.75rem 0.25rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-row">
            <h1>Home Inventory Management</h1>
            <button class="settings-btn no-kiosk" onclick="openSettingsModal()" title="Settings" aria-label="Settings">⚙</button>
        </div>
    </header>

    <nav class="tabs">
        <button class="tab active" data-panel="items"><span class="emoji">📦 </span>Items<span class="count" id="items-count">0</span></button>
        <button class="tab" data-panel="recipes"><span class="emoji">🍳 </span>Recepten<span class="count" id="recipes-count">0</span></button>
    </nav>

    <main>
        <!-- Items Panel (Voorraad + Boodschappen) -->
        <div id="items" class="panel active">
            <!-- Sub-tabs for Voorraad/Boodschappen -->
            <div class="sub-tabs">
                <button class="sub-tab active" data-subtab="grocery-section"><span class="emoji">🛒 </span>Boodschappen<span class="count" id="grocery-count">0</span></button>
                <button class="sub-tab" data-subtab="inventory-section"><span class="emoji">🏠 </span>Voorraad<span class="count" id="inventory-count">0</span></button>
            </div>

            <!-- Boodschappen Section -->
            <div id="grocery-section" class="sub-panel active">
                <div class="manual-add-section no-kiosk">
                    <div class="manual-add-row">
                        <input type="text" class="form-input" id="grocery-add-input" 
                               placeholder="Toevoegen aan boodschappenlijst..." list="items-datalist">
                        <datalist id="items-datalist"></datalist>
                        <button class="btn btn-warning" onclick="quickAddToGrocery()">Toevoegen</button>
                        <button class="btn btn-sm" onclick="openScanner('grocery_list')" title="Scannen"><span class="emoji">📷</span><span class="kiosk-only">Scan</span></button>
                    </div>
                </div>
                
                <div id="grocery-list" class="item-list"></div>
            </div>

            <!-- Voorraad Section -->

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        // State
        let html5QrCode = null;
        let isScanning = false;
        let currentScanMode = 'inventory'; // 'inventory' or 'grocery_list'
        let pendingBarcode = null;
        let selectedExistingItem = null;
        let allItems = [];
        let allRecipes = [];
        let inventoryNames = new Set();
        let inventoryItemIds = new Set();
        let recipeSearchQuery = '';
        let favFilterActive = false;
        // API base URL
        const API_BASE = '/api';
        const LAST_RECIPE_KEY = 'him:lastRecipeId';
        const IS_KIOSK = /^\/kiosk\/?$/.test(window.location.pathname);

        if (IS_KIOSK) {
            document.body.classList.add('kiosk');
        }

        function uiIcon(emoji, text) {
            return IS_KIOSK ? text : emoji;
        }

        function getUrlState() {
            const params = new URLSearchParams(window.location.search);
            return {
                tab: params.get('tab') === 'recipes' ? 'recipes' : 'items',
                sub: params.get('sub') === 'inventory' ? 'inventory' : 'grocery',
                recipe: params.get('recipe')
            };
        }

        function getLastRecipeId() {
            return localStorage.getItem(LAST_RECIPE_KEY);
        }

        function setLastRecipeId(id) {
            if (id == null || id === '') {
                localStorage.removeItem(LAST_RECIPE_KEY);
                return;
            }
            localStorage.setItem(LAST_RECIPE_KEY, String(id));
        }

        function syncUrlFromUi() {
            const params = new URLSearchParams();
            const activePanel = document.querySelector('.tab.active')?.dataset.panel || 'items';
            params.set('tab', activePanel);

            if (activePanel === 'items') {
                const activeSub = document.querySelector('.sub-tab.active')?.dataset.subtab;
                params.set('sub', activeSub === 'inventory-section' ? 'inventory' : 'grocery');
            } else {
                const recipeId = getLastRecipeId();
                if (recipeId) params.set('recipe', recipeId);
            }

            const url = `${window.location.pathname}?${params.toString()}`;
            if (url !== `${window.location.pathname}${window.location.search}`) {
                history.replaceState(null, '', url);
            }
        }

        function applyUrlState(state) {
            if (state.recipe) setLastRecipeId(state.recipe);

            switchPanel(state.tab, false);
            if (state.tab === 'items') {
                const subtabId = state.sub === 'inventory' ? 'inventory-section' : 'grocery-section';
                const subTab = document.querySelector(`[data-subtab="${subtabId}"]`);
                if (subTab) switchSubPanel(subTab, false);
            }
            syncUrlFromUi();
        }

        function openRecipe(recipeId, edit = false) {
            setLastRecipeId(recipeId);
            syncUrlFromUi();
            if (IS_KIOSK) {
                window.location.href = `/recipe/${recipeId}?kiosk=1`;
                return;
            }
            window.location.href = edit
                ? `/recipe/${recipeId}?edit=1`
                : `/recipe/${recipeId}`;
        }

        function highlightLastRecipe() {
            document.querySelectorAll('.recipe-card.highlighted').forEach(el => {
                el.classList.remove('highlighted');
            });
            const recipeId = getLastRecipeId();
            if (!recipeId) return;
            const card = document.getElementById(`recipe-card-${recipeId}`);
            if (!card) return;
            card.classList.add('highlighted');
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Set up tab navigation
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => switchPanel(tab.dataset.panel));
            });

            // Set up sub-tab navigation
            document.querySelectorAll('.sub-tab').forEach(tab => {
                tab.addEventListener('click', () => switchSubPanel(tab));
            });

            // Set up item name search in modal
            const itemNameInput = document.getElementById('modal-item-name');
            let searchTimeout;
            itemNameInput.addEventListener('input', () => {
                clearTimeout(searchTimeout);
                selectedExistingItem = null;
                searchTimeout = setTimeout(() => searchItems(itemNameInput.value), 300);
            });

            // Handle Enter key for manual inputs
            document.getElementById('inventory-add-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') quickAddToInventory();
            });
            document.getElementById('grocery-add-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') quickAddToGrocery();
            });
            const recipeUrlInput = document.getElementById('recipe-url-input');
            if (recipeUrlInput) {
                recipeUrlInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') importRecipeFromUrl();
                });
            }

            // Recipe search filter
            const recipeSearchInput = document.getElementById('recipe-search-input');
            if (recipeSearchInput) {
                recipeSearchInput.addEventListener('input', (e) => {
                    recipeSearchQuery = e.target.value.trim().toLowerCase();
                    renderRecipes();
                });
            }

            // Restore tab / sub-tab / last recipe from the URL
            applyUrlState(getUrlState());

            // Load initial data
            loadInventory();
            loadGrocery();
            loadAllItems();
            loadRecipes();
        });

        // Panel Navigation
        function switchPanel(panelId, updateUrl = true) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            
            document.querySelector(`[data-panel="${panelId}"]`).classList.add('active');
            document.getElementById(panelId).classList.add('active');
            if (updateUrl) syncUrlFromUi();
            if (panelId === 'recipes') highlightLastRecipe();
        }

        // Sub-panel Navigation
        function switchSubPanel(tabElement, updateUrl = true) {
            const container = tabElement.closest('.panel');
            const subtabId = tabElement.dataset.subtab;
            
            // Update sub-tab styles
            container.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
            tabElement.classList.add('active');
            
            // Show/hide sub-panels
            container.querySelectorAll('.sub-panel').forEach(p => p.classList.remove('active'));
            document.getElementById(subtabId).classList.add('active');
            if (updateUrl) syncUrlFromUi();
        }

        // Update combined counts
        function updateItemsCount() {
            const inventory = parseInt(document.getElementById('inventory-count').textContent) || 0;
            const grocery = parseInt(document.getElementById('grocery-count').textContent) || 0;
            document.getElementById('items-count').textContent = inventory + grocery;
        }

        function updateRecipesCount() {
            document.getElementById('recipes-count').textContent = allRecipes.length;
        }

        // Scanner Modal
        function openScanner(mode) {
            if (IS_KIOSK) return;
            currentScanMode = mode;
            const modeIndicator = document.getElementById('current-mode');
            if (mode === 'inventory') {
                modeIndicator.textContent = 'Voorraad';
                modeIndicator.className = 'scan-mode-value inventory';
            } else {
                modeIndicator.textContent = 'Boodschappenlijst';
                modeIndicator.className = 'scan-mode-value grocery';
            }
            document.getElementById('scanner-result').style.display = 'none';
            document.getElementById('scanner-modal').classList.add('active');
            startScanner();
        }

        async function closeScanner() {
            await stopScanner();
            document.getElementById('scanner-modal').classList.remove('active');
        }

        // Scanner Functions
        async function toggleScanner() {
            if (isScanning) {
                await stopScanner();
            } else {
                await startScanner();
            }
        }

        async function startScanner() {
            const btn = document.getElementById('start-scanner');
            
            try {
                html5QrCode = new Html5Qrcode("reader");
                
                await html5QrCode.start(
                    { facingMode: "environment" },
                    {
                        fps: 10,
                        qrbox: { width: 250, height: 100 },
                        aspectRatio: 1.0
                    },
                    onScanSuccess,
                    onScanFailure
                );
                
                isScanning = true;
                btn.textContent = '⏹ Stop scanner';
                btn.classList.remove('btn-primary');
            } catch (err) {
                console.error('Failed to start scanner:', err);
                showToast('Cameratoegang mislukt. Probeer HTTPS of controleer de rechten.', 'error');
            }
        }

        async function stopScanner() {
            const btn = document.getElementById('start-scanner');
            
            if (html5QrCode && isScanning) {
                try {
                    await html5QrCode.stop();
                } catch (err) {
                    console.error('Error stopping scanner:', err);
                }
            }
            
            isScanning = false;
            btn.textContent = '📷 Start scanner';
            btn.classList.add('btn-primary');
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (navigator.vibrate) navigator.vibrate(100);
            lookupBarcode(decodedText);
        }

        function onScanFailure(error) {}

        // Barcode Lookup
        async function lookupBarcode(code) {
            const resultDiv = document.getElementById('scanner-result');
            resultDiv.style.display = 'block';
            resultDiv.textContent = `Looking up: ${code}...`;
            resultDiv.className = 'scanner-result';

            try {
                const response = await fetch(`${API_BASE}/barcode/${encodeURIComponent(code)}`);
                const data = await response.json();
                const targetLabel = currentScanMode === 'inventory' ? 'Voorraad' : 'Boodschappenlijst';

                if (data.found) {
                    resultDiv.innerHTML = `Gevonden: <strong>${data.item.name}</strong>`;
                    resultDiv.className = 'scanner-result success';

                    await moveItem(data.item.id, currentScanMode);
                    showToast(`${data.item.name} → ${targetLabel}`, 'success');

                    loadInventory();
                    loadGrocery();
                    loadAllItems();
                } else {
                    resultDiv.innerHTML = `Nieuwe barcode: <strong>${code}</strong>`;
                    resultDiv.className = 'scanner-result new';
                    showNewItemModal(code, data.suggested_name, data.suggested_brands);
                }
            } catch (err) {
                resultDiv.textContent = `Error: ${err.message}`;
                showToast('Failed to look up barcode', 'error');
            }
        }

        // Modal Functions
        function showNewItemModal(barcode, suggestedName, suggestedBrands) {
            pendingBarcode = barcode;
            selectedExistingItem = null;
            
            document.getElementById('modal-barcode').value = barcode;
            const nameInput = document.getElementById('modal-item-name');
            // Prefer product name; fall back to brands so the field isn't empty
            nameInput.value = (suggestedName || suggestedBrands || '').trim();
            document.getElementById('search-results').style.display = 'none';
            document.getElementById('new-item-modal').classList.add('active');
            if (nameInput.value) {
                nameInput.select();
            } else {
                nameInput.focus();
            }
        }

        function closeModal() {
            document.getElementById('new-item-modal').classList.remove('active');
            pendingBarcode = null;
            selectedExistingItem = null;
        }

        async function searchItems(query) {
            const resultsDiv = document.getElementById('search-results');
            
            if (!query || query.length < 2) {
                resultsDiv.style.display = 'none';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/search?q=${encodeURIComponent(query)}`);
                const items = await response.json();

                if (items.length === 0) {
                    resultsDiv.style.display = 'none';
                    return;
                }

                resultsDiv.innerHTML = items.map(item => `
                    <div class="search-result-item" onclick="selectExistingItem(${item.id}, '${item.name.replace(/'/g, "\\'")}')">
                        ${item.name}
                        <small style="color: var(--text-secondary); display: block;">
                            ${item.location === 'inventory' ? '🏠 Voorraad' : 
                              item.location === 'grocery_list' ? '🛒 Boodschappen' : 
                              '📦 Archief'}
                        </small>
                    </div>
                `).join('');
                resultsDiv.style.display = 'block';
            } catch (err) {
                console.error('Error searching items:', err);
            }
        }

        function selectExistingItem(id, name) {
            selectedExistingItem = { id, name };
            document.getElementById('modal-item-name').value = name;
            document.getElementById('search-results').style.display = 'none';
        }

        async function createItem(location) {
            const itemName = document.getElementById('modal-item-name').value.trim();
            
            if (!itemName) {
                showToast('Voer een naam in', 'error');
                return;
            }

            try {
                if (selectedExistingItem) {
                    await fetch(`${API_BASE}/barcode/associate`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            barcode: pendingBarcode,
                            item_id: selectedExistingItem.id
                        })
                    });
                    
                    await moveItem(selectedExistingItem.id, location);
                    showToast(`Barcode toegevoegd aan ${selectedExistingItem.name}`, 'success');
                } else {
                    const response = await fetch(`${API_BASE}/items`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: itemName,
                            location: location,
                            barcode: pendingBarcode
                        })
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.detail || 'Item aanmaken mislukt');
                    }

                    showToast(`Aangemaakt: ${itemName}`, 'success');
                }

                closeModal();
                loadInventory();
                loadGrocery();
                loadAllItems();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function quickAddToInventory() {
            const input = document.getElementById('inventory-add-input');
            const itemName = input.value.trim();
            if (!itemName) return;

            const existing = allItems.find(i => i.name.toLowerCase() === itemName.toLowerCase());
            
            try {
                if (existing) {
                    await moveItem(existing.id, 'inventory');
                } else {
                    await fetch(`${API_BASE}/items`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: itemName, location: 'inventory' })
                    });
                }
                
                input.value = '';
                showToast(`${itemName} toegevoegd aan voorraad`, 'success');
                loadInventory();
                loadGrocery();
                loadAllItems();
            } catch (err) {

        // Recipe Functions
        async function loadRecipes() {
            try {
                const response = await fetch(`${API_BASE}/recipes`);

                renderRecipes();

        // Compute how many ingredients are available in inventory.
        // Mirror the recipe detail page: prefer the linked item_id, fall back to name.
        function recipeAvailability(recipe) {
            const ingredients = recipe.ingredients || [];
            const total = ingredients.length;
            const available = ingredients.filter(ing =>
                ing.item_id
                    ? inventoryItemIds.has(ing.item_id)
                    : inventoryNames.has(ing.name.toLowerCase())
            ).length;
            const percentage = total > 0 ? available / total : 0;
            return { total, available, percentage };
        }

        function renderRecipes() {
            const listDiv = document.getElementById('recipe-list');
            if (!listDiv) return;

            // Filter by search text and favorite toggle
            let recipes = allRecipes.filter(r => {
                if (favFilterActive && !r.is_favorite) return false;
                if (recipeSearchQuery && !r.name.toLowerCase().includes(recipeSearchQuery)) return false;
                return true;
            });

            // Sort by percentage of ingredients in stock (descending)
            recipes = recipes
                .map(r => ({ recipe: r, avail: recipeAvailability(r) }))
                .sort((a, b) => b.avail.percentage - a.avail.percentage);

            if (recipes.length === 0) {
                const emptyText = allRecipes.length === 0
                    ? 'Nog geen recepten opgeslagen'
                    : 'Geen recepten gevonden';
                listDiv.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📖</div>
                        <p>${emptyText}</p>
                        ${allRecipes.length === 0 && !IS_KIOSK ? '<p style="font-size: 0.85rem; margin-top: 0.5rem;">Importeer een recept via URL hierboven.</p>' : ''}
                    </div>
                `;
                return;
            }

            listDiv.innerHTML = recipes.map(({ recipe, avail }) => {
                const { total, available, percentage } = avail;
                let statusClass, statusText;
                if (total === 0) {
                    statusClass = 'partial';
                    statusText = 'Geen ingrediënten opgegeven';
                } else if (available === total) {
                    statusClass = 'complete';
                    statusText = IS_KIOSK
                        ? `Alle ${total} ingrediënten in voorraad (100%)`
                        : `✓ Alle ${total} ingrediënten in voorraad (100%)`;
                } else if (available === 0) {
                    statusClass = 'missing';
                    statusText = IS_KIOSK
                        ? `0/${total} ingrediënten in voorraad (0%)`
                        : `✗ 0/${total} ingrediënten in voorraad (0%)`;
                } else {
                    statusClass = 'partial';
                    statusText = IS_KIOSK
                        ? `${available}/${total} ingrediënten in voorraad (${Math.round(percentage * 100)}%)`
                        : `◐ ${available}/${total} ingrediënten in voorraad (${Math.round(percentage * 100)}%)`;
                }

                const per100 = recipe.nutrition?.per_100g || {};
                const kcal = per100.energy_kcal;
                const protein = per100.proteins;
                const carbs = per100.carbohydrates;
                const fat = per100.fat;
                const nutritionPreview = `
                    <div class="recipe-nutrition-preview">
                        <span><strong>Per 100 g:</strong></span>
                        <span>Energie ${kcal != null ? kcal + ' kcal' : '—'}</span>
                        <span>Eiwit ${protein != null ? protein + ' g' : '—'}</span>
                        <span>Koolh. ${carbs != null ? carbs + ' g' : '—'}</span>
                        <span>Vet ${fat != null ? fat + ' g' : '—'}</span>
                    </div>
                `;

                const actions = IS_KIOSK ? '' : `
                    <div style="display: flex; gap: 0.5rem; flex-shrink: 0;" onclick="event.stopPropagation();">
                        <button class="btn btn-sm" onclick="openRecipe(${recipe.id}, true)" title="Bewerken">✏️</button>
                        <button class="btn btn-sm" onclick="toggleFavoriteRecipe(${recipe.id})" title="${recipe.is_favorite ? 'Verwijder favoriet' : 'Maak favoriet'}">${recipe.is_favorite ? '★' : '☆'}</button>
                        <button class="btn btn-sm" onclick="deleteRecipe(${recipe.id}, '${recipe.name.replace(/'/g, "\\'")}')" title="Verwijderen" style="color: var(--accent-red);">🗑</button>
                    </div>
                `;

                return `
                    <div class="recipe-card" id="recipe-card-${recipe.id}" style="display: flex; justify-content: space-between; align-items: flex-start;">
                        <div onclick="openRecipe(${recipe.id})" style="flex: 1; cursor: pointer;">
                            <h3>
                                ${recipe.is_favorite && !IS_KIOSK ? '<span class="favorite-star">★</span> ' : ''}
                                ${recipe.name}
                            </h3>
                            <div class="recipe-meta">
                                ${recipe.servings} porties
                                ${recipe.prep_time_minutes ? ` • ${recipe.prep_time_minutes} min voorbereiding` : ''}
                                ${recipe.cook_time_minutes ? ` • ${recipe.cook_time_minutes} min koken` : ''}
                            </div>
                            ${nutritionPreview}
                            <div class="ingredient-status ${statusClass}">
                                ${statusText}
                            </div>
                        </div>
                        ${actions}
                    </div>
                `;
            }).join('');

            highlightLastRecipe();
        }

        // ========== Import Recipe from URL ==========
        async function importRecipeFromUrl() {
            const input = document.getElementById('recipe-url-input');
            const btn = document.getElementById('import-url-btn');
            const url = (input?.value || '').trim();

            if (!url) {
                showToast('Voer een recept-URL in', 'error');
                return;
            }
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                showToast('Voer een geldige URL in', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>';

            try {
                const response = await fetch(`${API_BASE}/recipes/import-url`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(error.detail || 'Recept importeren mislukt');
                }
                const recipe = await response.json();
                showToast(`Geïmporteerd: ${recipe.name}`, 'success');
                input.value = '';
                loadRecipes();
                window.location.href = `/recipe/${recipe.id}`;
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Importeren';
            }
        }

        async function openEditItemModal(id, name, location) {

        let editingBarcodeId = null;
        let editBarcodesById = {};

        function renderEditBarcodes(item) {
            const barcodesGroup = document.getElementById('edit-barcodes-group');
            const barcodesList = document.getElementById('edit-barcodes-list');

            if (!item.barcodes || item.barcodes.length === 0) {
                barcodesGroup.style.display = 'none';
                editBarcodesById = {};
                return;
            }

            editBarcodesById = {};
            item.barcodes.forEach(b => { editBarcodesById[b.id] = b; });

            barcodesGroup.style.display = 'block';
            barcodesList.innerHTML = item.barcodes.map(b => {
                const label = b.product_name || b.brands || '';
                const kcal = b.energy_kcal_100g != null ? `${b.energy_kcal_100g} kcal/100g` : '';
                return `
                    <div class="barcode-row ${b.is_active ? 'active' : ''}" onclick="setActiveBarcode(${b.id})">
                        <div class="barcode-row-main">
                            <span>
                                <code class="barcode-code">${escapeHtml(b.code)}</code>
                                ${b.is_active ? '<span class="barcode-badge">Actief</span>' : ''}
                            </span>
                            ${label ? `<div class="barcode-product">${escapeHtml(label)}${kcal ? ' · ' + kcal : ''}</div>` : (kcal ? `<div class="barcode-product">${kcal}</div>` : '')}
                        </div>
                        <div class="barcode-row-actions" onclick="event.stopPropagation()">
                            <button class="btn btn-sm" onclick="openEditBarcodeModal(${b.id})" title="Waarden bewerken">✎</button>
                            ${!b.is_active ? `<button class="btn btn-sm" onclick="setActiveBarcode(${b.id})">Actief</button>` : ''}
                            <button class="btn btn-sm" onclick="refreshBarcode(${b.id})" title="Vernieuw vanuit Open Food Facts">↻</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function _numOrEmpty(value) {
            return value == null || value === '' ? '' : value;
        }

        function openEditBarcodeModal(barcodeId) {
            const barcode = editBarcodesById[barcodeId];
            if (!barcode) {
                showToast('Barcode niet gevonden', 'error');
                return;
            }
            editingBarcodeId = barcode.id;
            const n = barcode.nutriments || {};
            document.getElementById('edit-bc-code').textContent = barcode.code || '';
            document.getElementById('edit-bc-product-name').value = barcode.product_name || '';
            document.getElementById('edit-bc-brands').value = barcode.brands || '';
            document.getElementById('edit-bc-kcal-100g').value = _numOrEmpty(barcode.energy_kcal_100g);
            document.getElementById('edit-bc-kcal-serving').value = _numOrEmpty(barcode.energy_kcal_serving);
            document.getElementById('edit-bc-proteins').value = _numOrEmpty(n.proteins_100g);
            document.getElementById('edit-bc-carbs').value = _numOrEmpty(n.carbohydrates_100g);
            document.getElementById('edit-bc-fat').value = _numOrEmpty(n.fat_100g);
            document.getElementById('edit-bc-sat-fat').value = _numOrEmpty(n['saturated-fat_100g']);
            document.getElementById('edit-bc-sugars').value = _numOrEmpty(n.sugars_100g);
            document.getElementById('edit-bc-fiber').value = _numOrEmpty(n.fiber_100g);
            document.getElementById('edit-bc-salt').value = _numOrEmpty(n.salt_100g);
            document.getElementById('edit-bc-allergens').value = (barcode.allergens || []).join(', ');
            document.getElementById('edit-barcode-modal').classList.add('active');
        }

        function closeEditBarcodeModal() {
            document.getElementById('edit-barcode-modal').classList.remove('active');
            editingBarcodeId = null;
        }

        function _parseOptionalNumber(id) {
            const raw = document.getElementById(id).value.trim();
            if (raw === '') return null;
            const n = Number(raw);
            return Number.isFinite(n) ? n : null;
        }

        async function saveEditBarcode() {
            if (!editingBarcodeId) return;

            const nutriments = {};
            const protein = _parseOptionalNumber('edit-bc-proteins');
            const carbs = _parseOptionalNumber('edit-bc-carbs');
            const fat = _parseOptionalNumber('edit-bc-fat');
            const satFat = _parseOptionalNumber('edit-bc-sat-fat');
            const sugars = _parseOptionalNumber('edit-bc-sugars');
            const fiber = _parseOptionalNumber('edit-bc-fiber');
            const salt = _parseOptionalNumber('edit-bc-salt');
            if (protein != null) nutriments.proteins_100g = protein;
            if (carbs != null) nutriments.carbohydrates_100g = carbs;
            if (fat != null) nutriments.fat_100g = fat;
            if (satFat != null) nutriments['saturated-fat_100g'] = satFat;
            if (sugars != null) nutriments.sugars_100g = sugars;
            if (fiber != null) nutriments.fiber_100g = fiber;
            if (salt != null) nutriments.salt_100g = salt;

            const allergensRaw = document.getElementById('edit-bc-allergens').value.trim();
            const allergens = allergensRaw
                ? allergensRaw.split(',').map(s => s.trim()).filter(Boolean)
                : [];

            const payload = {
                product_name: document.getElementById('edit-bc-product-name').value.trim() || null,
                brands: document.getElementById('edit-bc-brands').value.trim() || null,
                energy_kcal_100g: _parseOptionalNumber('edit-bc-kcal-100g'),
                energy_kcal_serving: _parseOptionalNumber('edit-bc-kcal-serving'),
                allergens,
                nutriments,
            };

            try {
                const response = await fetch(`${API_BASE}/barcodes/${editingBarcodeId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(error.detail || 'Opslaan mislukt');
                }
                closeEditBarcodeModal();
                if (editingItemId) {
                    const itemRes = await fetch(`${API_BASE}/items/${editingItemId}`);
                    if (itemRes.ok) renderEditBarcodes(await itemRes.json());
                }
                loadInventory();
                loadGrocery();
                loadRecipes();
                showToast('Barcode waarden opgeslagen', 'success');
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function setActiveBarcode(barcodeId) {
            if (!editingItemId) return;
            try {
                const response = await fetch(`${API_BASE}/items/${editingItemId}/active-barcode`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ barcode_id: barcodeId })
                });
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to set active barcode');

                loadInventory();
                loadGrocery();
                showToast('Active barcode updated', 'success');
            } catch (err) {
                showToast(err.message, 'error');
            }

        async function saveEditingItem() {
            if (!editingItemId) return;

            const name = document.getElementById('edit-item-name').value.trim();
            const location = document.getElementById('edit-item-location').value;

            if (!name) {
                showToast('Naam mag niet leeg zijn', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/items/${editingItemId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, location })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail);
                }

                showToast('Item bijgewerkt', 'success');
                closeEditItemModal();
                loadInventory();
                loadGrocery();
                loadAllItems();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function deleteEditingItem() {
            if (!editingItemId) return;

            if (!confirm('Weet je zeker dat je dit item wilt verwijderen? Dit kan niet ongedaan worden gemaakt.')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/items/${editingItemId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Item verwijderen mislukt');
                }

                showToast('Item verwijderd', 'success');
                closeEditItemModal();
                loadInventory();
                loadGrocery();
                loadAllItems();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        // ========== Grocery Suggestion Matching ==========
        let pendingGroceryItem = null;
        let selectedMatchItem = null;

        async function addSuggestionToGroceryWithMatch(itemName) {
            pendingGroceryItem = itemName;
            selectedMatchItem = null;
            
            document.getElementById('grocery-match-name').textContent = itemName;
            document.getElementById('grocery-match-new-name').value = itemName;
            
            // Search for similar items
            const resultsDiv = document.getElementById('grocery-match-results');
            const matches = allItems.filter(i => 
                i.name.toLowerCase().includes(itemName.toLowerCase()) ||
                itemName.toLowerCase().includes(i.name.toLowerCase())
            );
            
            if (matches.length > 0) {
                resultsDiv.innerHTML = `
                    <label class="form-label">Match with existing item:</label>
                    <div class="search-results" style="display: block; max-height: 150px;">
                        ${matches.slice(0, 5).map(item => `
                            <div class="search-result-item ${selectedMatchItem?.id === item.id ? 'selected' : ''}" 
                                 onclick="selectGroceryMatch(${item.id}, '${item.name.replace(/'/g, "\\'")}')">
                                ${item.name}
                                <small style="color: var(--text-secondary);">
                                    ${item.location === 'inventory' ? '🏠' : item.location === 'grocery_list' ? '🛒' : '📦'}
                                </small>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                resultsDiv.innerHTML = '<p style="color: var(--text-secondary); font-size: 0.85rem;">No similar items found in database.</p>';
            }
            
            document.getElementById('grocery-match-modal').classList.add('active');
        }

        function selectGroceryMatch(id, name) {
            selectedMatchItem = { id, name };
            document.getElementById('grocery-match-new-name').value = '';
            
            // Update UI to show selection
            document.querySelectorAll('#grocery-match-results .search-result-item').forEach(el => {
                el.classList.remove('selected');
            });
            event.target.closest('.search-result-item').classList.add('selected');
        }

        function closeGroceryMatchModal() {
            document.getElementById('grocery-match-modal').classList.remove('active');
            pendingGroceryItem = null;
            selectedMatchItem = null;
        }

        async function confirmGroceryMatch() {
            try {
                if (selectedMatchItem) {
                    // Use existing item
                    await moveItem(selectedMatchItem.id, 'grocery_list');
                    showToast(`${selectedMatchItem.name} added to grocery list`, 'success');
                } else {
                    // Create new item
                    const newName = document.getElementById('grocery-match-new-name').value.trim() || pendingGroceryItem;
                    const existing = allItems.find(i => i.name.toLowerCase() === newName.toLowerCase());
                    
                    if (existing) {
                        await moveItem(existing.id, 'grocery_list');
                    } else {
                        await fetch(`${API_BASE}/items`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name: newName, location: 'grocery_list' })
                        });
                    }
                    showToast(`${newName} added to grocery list`, 'success');
                }
                
                closeGroceryMatchModal();
                loadGrocery();
                loadAllItems();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        // ========== Gemini AI Recipe Suggestions ==========
        async function getGeminiRecipes() {
            const btn = document.getElementById('gemini-recipe-btn');
            const container = document.getElementById('gemini-results');
            const queryInput = document.getElementById('gemini-query-input');
            const query = queryInput.value.trim();

            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Generating...';
            container.innerHTML = '';

            try {
                // Get inventory items
                const invResponse = await fetch(`${API_BASE}/inventory`);
                const invData = await invResponse.json();
                const inventoryItems = invData.items.map(item => item.name);

                if (inventoryItems.length === 0) {
                    throw new Error('Add some items to your inventory first');
                }

                const requestBody = { inventory_items: inventoryItems };
                if (query) {
                    requestBody.query = query;
                }

                const response = await fetch(`${API_BASE}/ai/recipe-suggestions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to generate recipes');
                }

                const data = await response.json();
                renderGeminiRecipes(data.suggestions);
            } catch (err) {
                container.innerHTML = `<p style="color: var(--accent-red); margin-top: 1rem;">${err.message}</p>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '✨ Generate Recipe Ideas';
            }
        }

        function renderGeminiRecipes(recipes) {
            const container = document.getElementById('gemini-results');

            if (!recipes || recipes.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary); margin-top: 1rem;">No recipes generated. Try again.</p>';
                return;
            }

            container.innerHTML = `
                <div class="section-divider">✨ AI Suggestions</div>
                <div style="display: grid; gap: 0.75rem;">
                    ${recipes.map((r, idx) => `
                        <div class="recipe-card gemini-recipe" data-index="${idx}">
                            <h3 style="font-size: 0.95rem; margin: 0 0 0.5rem 0; color: var(--accent-purple);">${r.name}</h3>
                            <p style="font-size: 0.85rem; color: var(--text-secondary); margin: 0 0 0.5rem 0;">${r.description}</p>
                            <div class="recipe-meta" style="margin-bottom: 0.5rem;">
                                ${r.servings} servings
                                ${r.prep_time_minutes ? ` • ${r.prep_time_minutes}min prep` : ''}
                                ${r.cook_time_minutes ? ` • ${r.cook_time_minutes}min cook` : ''}
                            </div>
                            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                                <button class="btn btn-sm" onclick="toggleGeminiDetails(${idx})">View Details</button>
                                <button class="btn btn-sm btn-primary" onclick="saveGeminiRecipe(${idx})">💾 Save Recipe</button>
                            </div>
                            <div class="gemini-details" id="gemini-details-${idx}" style="display: none; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border);">
                                <h4 style="font-size: 0.85rem; margin: 0 0 0.5rem 0;">Ingredients:</h4>
                                <ul style="font-size: 0.85rem; margin: 0 0 0.75rem 1rem;">
                                    ${r.ingredients.map(i => `<li>${i.amount || ''} ${i.unit || ''} ${i.name}${i.notes ? ` (${i.notes})` : ''}</li>`).join('')}
                                </ul>
                                <h4 style="font-size: 0.85rem; margin: 0 0 0.5rem 0;">Steps:</h4>
                                <ol style="font-size: 0.85rem; margin: 0 0 0 1rem;">
                                    ${r.steps.map(s => `<li>${s.instruction}</li>`).join('')}
                                </ol>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            // Store recipes for saving
            window.geminiRecipes = recipes;
        }

        function toggleGeminiDetails(index) {
            const details = document.getElementById(`gemini-details-${index}`);
            details.style.display = details.style.display === 'none' ? 'block' : 'none';
        }

        async function saveGeminiRecipe(index) {
            const recipe = window.geminiRecipes[index];
            if (!recipe) {
                showToast('Recipe not found', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/recipes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(recipe)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to save recipe');
                }

                const saved = await response.json();
                showToast(`Saved: ${saved.name}`, 'success');
                loadRecipes();

                // Navigate to the saved recipe
                window.location.href = `/recipe/${saved.id}`;
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        // ========== Recipe Delete ==========
        async function deleteRecipe(recipeId, recipeName) {
            if (!confirm(`"${recipeName}" verwijderen? Dit kan niet ongedaan worden gemaakt.`)) return;

            try {
                const response = await fetch(`${API_BASE}/recipes/${recipeId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Recept verwijderen mislukt');

                if (String(getLastRecipeId()) === String(recipeId)) {
                    setLastRecipeId(null);
                    syncUrlFromUi();
                }
                showToast('Recept verwijderd', 'success');
                loadRecipes();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function toggleFavoriteRecipe(recipeId) {
            try {
                const response = await fetch(`${API_BASE}/recipes/${recipeId}/favorite`, {
                    method: 'POST'
                });

                if (!response.ok) throw new Error('Favoriet wijzigen mislukt');

                loadRecipes();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }
    </script>
</body>
</html>
